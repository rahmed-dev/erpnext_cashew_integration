open_questions:
  - Should revert be available on Validated/Imported runs (no posted docs)?
    Likely yes — just mark Reverted immediately with 0 reversals. TBD.
  - Should get_run_progress cover revert progress too, or separate endpoint?
    Simplest: reuse get_run_progress (rows_posted counts down as rows are reverted).

