patches:
  - id: p002
    name: Mobile/PWA file picker would not let you select a file
    date: 2026-08-07
    component: c005
    stage: done
    summary: >
      Bug: on the installed PWA / mobile browser, tapping the dropzone either did nothing
      or opened a picker with every file greyed out — no file selectable. Three independent
      causes, all in frontend/src/components/run-workspace/upload/CsvDropzone.vue:
      (1) RE-ENTRANT CLICK — the hidden <input type=file> was rendered INSIDE the dropzone
      div that carries @click="pickFile". pickFile() called input.click(); that synthetic
      click bubbled up to the same handler, which clicked the input again. Desktop browsers
      swallow the re-entry; mobile WebKit/Chrome commonly abort the picker instead. Fix: the
      input is hoisted out of the clickable div and addressed via a template ref instead of
      document.getElementById.
      (2) ACCEPT vs MOBILE PICKERS — iOS Files maps the accept list to UTIs and greys out
      anything it cannot map; .sqlite/.db have no registered UTI or MIME at all, and Android
      hands back text/plain or application/octet-stream for a .csv, neither of which was in
      ACCEPT_CSV. Fix: extension tokens are now first-class in both accept lists (.csv;
      .sql/.sqlite/.db) with widened MIME hints, and on coarse-pointer devices
      (matchMedia('(pointer: coarse)')) the accept attribute is OMITTED ENTIRELY so the
      picker shows everything. Selection is then enforced client-side by extension in
      onFile() (hasAllowedExt → toast "Select a .csv file." / ".sql / .sqlite / .db"),
      which matches the c005 contract that extension, not MIME, is the authority. Server
      remains authoritative (reader raises SQL_FILE_UNREADABLE on a non-SQLite payload).
      (3) display:none INPUT — class="hidden" is display:none, which iOS Safari has a long
      history of ignoring for programmatic .click(). Fix: visually-hidden (sr-only, 1px,
      tabindex=-1, aria-hidden) instead.
      VERIFIED: yarn build green, PWA sw.js regenerated (30 precache entries). Requires
      `bench build --app cashew_integration` on the server + a service-worker refresh on the
      phone (the old sw.js precaches the previous bundle — see verification notes). NOT
      git-committed.

  - id: p001
    name: Close queue-time gate hole — unpaired Transfer legs half-posted
    date: 2026-07-05
    stage: done
    summary: >
      Bug: importing (esp. via SQL with a date window) could half-post — valid rows
      committed while some rows stayed errored. Root cause traced on run 000010
      (Failed, 71 posted + 4 Error/TRANSFER_PAIR_INCOMPLETE, posted=N): an internal
      Transfer leg whose partner is absent (filtered out by the date window, or in a
      different file) passed the queue-time gate as Valid — validation._validate_single_row
      bypasses every check for transfer-family rows and never verified transfer_pair_row_idx
      was set. So queue_run's failed_count was 0, the run queued, and only the WORKER
      discovered the orphan at the end (pending_transfer leftover → TRANSFER_PAIR_INCOMPLETE)
      AFTER other rows already committed (per-N-row commits, not atomic) → partial import.
      api.row_explorer_revalidate already guarded this; the authoritative
      validate_rows_at_queue_time path did not.
      Fix: added the unpaired-Transfer-leg guard at the top of _validate_single_row
      (txn_type=="Transfer" and not transfer_pair_row_idx → Error TRANSFER_PAIR_INCOMPLETE;
      External Transfer / Adjustment post standalone and are exempt). Now failed_count>0 at
      queue time and queue_run throws RUN_BLOCKED_BY_ROW_ERRORS → whole run blocked until
      fixed (all-or-nothing, per user ask). Also disabled the SPA Queue button + added a
      red "Fix N errored rows before queueing" hint in RunHeader.vue when rows_failed>0
      (turns click-then-error into a visible blocked state; server stays authoritative).
      Verified: direct test (scratchpad/test_pairgate.py) — unpaired Transfer → Error,
      paired legs + External Transfer unaffected, failed_count=1. bench build green.
      NOT git-committed. RESIDUAL (separate, larger): post_row/post_transfer_pair can still
      throw an ERPNext submit error at post time (POSTING_ERROR) → partial import; that is
      not pre-detectable and needs atomic posting (conflicts with current per-N-row commits +
      live progress) — a design change, not done here.
    files:
      - cashew_integration/importer/validation.py  # _validate_single_row guard
      - frontend/src/components/run-workspace/RunHeader.vue  # Queue button gate + hint
  - id: p002
    name: Decouple import state from Validate — stop the "validate is posting" illusion
    date: 2026-07-05
    stage: done
    summary: >
      User report: "validate is triggering post — it posts the pass rows, not the error
      rows." No GL is ever created by Validate. Real cause: validate_import ran
      apply_idempotency_guard, whose _mark_skipped stamps posted_doctype + posted_docname
      + validation_status=Skipped onto every row matching an already-posted document, and
      validate_import then PERSISTED those fields. So on Validate, every row overlapping a
      prior import flipped to "Skipped, posted as JE-xxxx" and rendered as posted — import
      state bleeding into a pure check. Confirmed on run 000011: 71/75 rows Skipped|posted=Y
      after a SQLite import that overlapped the earlier CSV run, with 0 new GL from validate.
      Fix (1 file, api.validate_import): removed the apply_idempotency_guard call and dropped
      posted_doctype/posted_docname/is_duplicate from the persist loop. Validate now only
      checks rows + reports errors; it never writes posting state. Duplicates are still
      surfaced + skipped at queue_run (unchanged, still calls the guard) and re-checked by the
      worker at post time, so nothing double-posts — correctness intact. Trade-off: the
      pre-queue duplicate preview moves from Validate to Queue time.
      Verified: api.py parses; guard now referenced only by queue_run (+ import). Python-only,
      no rebuild. NOT git-committed.
    files:
      - cashew_integration/api.py  # validate_import: no idempotency, no posted-field persist
  - id: p003
    name: Decouple state machine — Validate never advances (Option A); explicit arm_import step
    date: 2026-07-05
    stage: done
    summary: >
      User chose Option A: Validate is a pure check that NEVER advances run status; a separate
      explicit "Ready to Import" step arms the run; Queue posts. Distinction that resolved the
      confusion: run status (lifecycle) vs per-row validation_status — validation marks ROWS
      Error, never a run "error" status; the run just doesn't move.
      New flow: Draft -parse-> Parsed -(Validate: pure check, stays Parsed)-> fix rows in
      workbench -> Ready to Import (arm_import) -> Validated -> Queue -> post.
      Backend (api.py): validate_import no longer db_sets status (returns run.status unchanged);
      new arm_import(run_name) endpoint = Parsed->Validated, runs config + queue-time row
      validation + idempotency guard (dup-stamping lives HERE now, as import prep), throws
      RUN_BLOCKED_BY_ROW_ERRORS if any row errored, throws if 0 valid. queue_run unchanged
      (still requires Validated, re-validates as backstop) so posting stays airtight; triple
      idempotency (arm/queue/worker) is harmless.
      SPA: RunWorkspace routes Parsed->RowsWorkbench (was PreviewSection — retired from switch)
      so rows are reviewed+fixed BEFORE arming; RowsWorkbench editable at Parsed+Validated;
      RunHeader Parsed actions = [Re-parse, Discard, Validate, Ready to Import(primary)],
      Validated = [Re-validate, Queue]; isBlocked disables BOTH arm+queue when rows_failed>0
      (Validate never blocked); Discard deletes the run + routes to /runs; StateStepper relabeled
      Preview->"Review & Fix"(Parsed), Workbench->"Import"(Validated+).
      Desk form (cashew_import_run.js): added _arm_import handler + "Ready to Import" btn at Parsed.
      Verified end-to-end on a throwaway SQLite run (scratchpad/test_arm_flow.py, June window,
      auto-deleted, never posted): after parse=Parsed; after validate=Parsed (NO advance) with 0
      rows stamped posted_docname (NO posting illusion); validate reported 7 errors; arm_import
      refused (RUN_BLOCKED_BY_ROW_ERRORS) leaving status Parsed. bench build green.
      NOT git-committed. NOTE: arm happy-path (0 errors -> Validated) not directly exercised
      (this window had 7 errors) but the guard code is trivial past the blocks. Pre-existing
      recovery quirk left as-is: Failed/Cancelled 'Re-validate' + Reverted 'Re-queue' call
      endpoints whose status guards don't include those states (predates this change).
    files:
      - cashew_integration/api.py  # validate_import no status advance; new arm_import
      - frontend/src/pages/RunWorkspace.vue  # Parsed -> RowsWorkbench
      - frontend/src/components/run-workspace/sections/RowsWorkbench.vue  # editable at Parsed
      - frontend/src/components/run-workspace/RunHeader.vue  # arm action, discard, block arm+queue
      - frontend/src/components/run-workspace/StateStepper.vue  # relabel steps
      - cashew_integration/cashew_integration/doctype/cashew_import_run/cashew_import_run.js  # arm btn

test_requirements:
  automated: true
  notes: >
    Golden test — feed the same set of transactions as both a CSV and a SQLite
    file; assert identical source_hash per row and identical posting outcomes.
