# f006

id: f006
name: Rules Clarity & Party Resolution v2
status: pending-review
stage: dev-done
priority: high
owner: bmad-fb-orch

goal: >
  Make import behavior predictable and auditable for the user: rich party
  resolution that handles loans and per-employer salary, a readable Import
  Row table, and a clear "why did this row resolve this way?" answer for
  every row.

problem: >
  Three connected pains the user hit while running real imports:

  1. Party resolution is too coarse.
     - Run-level defaults are a single Customer (Income) and single
       Supplier (Expense). Cannot model multi-employer salary or any loan
       flow (Lent / Loan Received / Loan Repayment), where the party type
       and identity should depend on the category — not just on income vs
       expense direction.
     - There is no way to attach a default party to a category mapping
       (e.g. "Salary" → specific employer Customer) or to an account
       mapping (e.g. all txns on "NSave" → linked Supplier).
     - Counterpart hints in the CSV (note / title text) are not used at
       all for party resolution.

  2. The Import Row child table is hard to read.
     - 30+ fields, 20+ marked in_list_view → grid floods sideways with
       overlapping resolution / validation / posting columns.
     - No grouping, color, or mode toggle — every run looks the same
       whether the user is verifying mappings, fixing errors, or auditing
       posted docs.
     - Long validation_error_message strings truncate awkwardly in the
       grid; no hover / expand affordance.

  3. The resolution rules are not surfaced.
     - Logic is spread across four places: Cashew Account Mapping,
       parser txn_type detection, Cashew Category Mapping (incl.
       requires_party), and run-level default_customer / default_supplier.
     - There is no per-row diagnostic explaining which rule(s) fired,
       which fell through, and which run default filled the gap. Users
       have to read the source to understand outcomes.

user_stories:
  - As an accountant tracking salary from multiple employers, I can attach
    a specific Customer to the "Salary" category so each salary row posts
    against the right party without per-row overrides.
  - As an accountant booking a loan I made, I can mark a category as
    Lending → routes to a Loan Account with the borrower attached as the
    party — even though it is an Expense direction in Cashew.
  - As an accountant booking a loan repayment received, I can capture
    that the inflow reduces a receivable / increases payable to the right
    counterparty — without abusing default_customer.
  - As an accountant scanning a 500-row import, I can switch the Import
    Rows table between Compact, Resolution, Validation, and Posted views
    — each shows ≤ 6 columns relevant to the task.
  - As an accountant who cares why a row resolved as it did, I can open a
    row and see: which Account Mapping fired, which Category Mapping
    fired (or fell through to default), which party rule resolved the
    party (per-category, per-account, run default, preview override), and
    why the txn_type was set this way.
  - As an accountant cleaning up a problem run, I can bulk-override
    party for a filtered set of rows (e.g. all category=Salary rows in
    this run) instead of editing one-by-one.

opportunities_brainstorm:
  party_v2:
    - Per-category default party + party_type on Cashew Category Mapping
      (overrides run-level defaults).
    - Per-account default party on Cashew Account Mapping (e.g. "NSave"
      always pairs with bank Supplier).
    - Allow Customer party for Expense direction and Supplier party for
      Income direction — driven by category configuration, not txn_type.
    - Counterpart-text matcher: optional rule list (regex / contains on
      title or note) → party. Lowest precedence after explicit per-row
      override.
    - Loan handling: either new txn_type "Loan" (parser-detected from
      reserved category names) OR a "kind" field on Category Mapping
      (Income / Expense / Loan / Transfer / Adjustment) that drives
      route + account selection.
    - Precedence chain (highest → lowest): per-row preview override →
      per-account default party → per-category default party →
      counterpart-text rule → run-level default by direction.

  table_readability:
    - Cut in_list_view to ~6 fields by default (suggested baseline:
      row_idx, txn_date, raw_amount, txn_type, resolved_route,
      validation_status).
    - Add a Cashew Row Explorer report (frappe Report Builder or a Vue
      page) with column presets — Compact, Resolution, Validation,
      Posted, Loans-and-Parties.
    - Status pills with color (Valid / Error / Skipped / Posted /
      Reverted) instead of raw text.
    - Inline truncation + click-to-expand for validation_error_message
      and note.
    - Group resolution columns under a collapsible header when the
      Resolution preset is active.

  rule_clarity:
    - Per-row "Resolution Trace" panel — list every rule the engine
      considered, marking which fired and which fell through. Shown on
      Cashew Import Row form view.
    - Persist a compact resolution_trace JSON field on each row so the
      trace survives revert / re-validate.
    - Rules dashboard on Cashew Settings: precedence diagram, plus
      per-mapping hit count from last N runs (shows which rules are
      load-bearing and which are dead).
    - "Explain this row" action on the Import Run grid that opens a
      side panel with the trace for the selected row.

  bulk_ops:
    - Bulk per-row party override action on Cashew Import Run: filter
      rows in the grid (by category, raw_account, txn_type, validation
      status) and set party_type + party in one shot.
    - Re-run mapping resolution on a single row or a filtered subset
      after editing Cashew Settings — without re-parsing the CSV.

acceptance_notes:
  - This feature is a discovery / architecture pass, not a quick patch.
    Route through bmad-fb-architect → bmad-fb-td → bmad-fb-dev.
  - Architect to decide: extend Cashew Category Mapping vs introduce a
    Cashew Party Rule doctype; whether Loan is a new txn_type or a
    category "kind" attribute; schema migration shape (new fields are
    additive — existing runs must keep working).
  - TD to break the work into components — at minimum: schema change,
    mapping engine v2, resolution-trace persistence, list-view + report
    presets, rules dashboard, bulk override action.
  - Backwards compatibility: existing imports already done must stay
    revertable via f004 paths; no rewrite of past Cashew Import Row
    rows on migration.
  - Out of scope (defer to f002 if/when reopened): live API sync. This
    feature is strictly about the existing CSV ingestion pipeline.

open_questions_resolved:
  # All four resolved during architect pass 2026-05-03.
  # See arch/decisions.md for full rationale on each.
  - q: Loan as new txn_type vs category "kind" attribute?
    resolved: category_type Select on Cashew Category Mapping with 4 options
      (Income / Expense / Loan Out / Loan In). Direction (income_flag) +
      category_type combine to pick one of 4 loan posting routes.
    decision_ref: arch/decisions.md#decision-1
  - q: Counterpart-text rules — Category Mapping child table or separate
      Cashew Counterpart Rule doctype?
    resolved: Dropped entirely. No rule-based party resolution. Party set
      manually per row in Vue Row Explorer. Cashew CSV carries no usable
      party signal; rules add complexity without value.
    decision_ref: arch/decisions.md#decision-2
  - q: Resolution trace persisted vs computed on-demand?
    resolved: Dropped (no rules → nothing to trace). History panel also
      dropped per user direction.
    decision_ref: arch/decisions.md#decision-2
  - q: Row Explorer — Frappe Report or Vue page?
    resolved: Frappe Page mounted at /app/cashew-row-explorer/<run-name>,
      Vue-based. Inline edit + fix-modal capabilities require Vue (Script
      Report cannot mutate). Stays in Desk for native permissions + nav.
    decision_ref: arch/decisions.md#decision-3

scope_revisions_during_arch:
  # Things the original f006 stub proposed that the architect pass dropped.
  - dropped: Per-category default party + party_type on Cashew Category Mapping.
    why: Decision 2 — no rule-based party. Manual per-row instead.
  - dropped: Per-account default party on Cashew Account Mapping.
    why: Decision 2.
  - dropped: Counterpart-text matcher.
    why: Decision 2 — no notes maintained in Cashew CSV.
  - dropped: Precedence chain across rules.
    why: Decision 2 — no rules.
  - dropped: Resolution trace JSON field on Cashew Import Row.
    why: Decision 2 — nothing to trace.
  - dropped: Rules dashboard on Cashew Settings.
    why: Decision 2 — no rules to dashboard.
  - dropped: Per-row "Resolution Trace" panel + "Explain this row".
    why: Decision 2 / Decision 3 — no trace; user dropped history panel.
  - dropped: Run-level default_customer / default_supplier as active fields.
    why: Decision 2 — manual per-row only. Columns kept nullable for f004
      revert backwards-compat; hidden from Run form.
  - parked: Prefill party from prior import (similarity match).
    why: User-raised future idea. Out of f006 scope. See arch/parked.md#p1.

components:
  - id: c001
    name: schema-loan-and-category-type
    type: doctype
    depends_on: []
    spec_file: specs/c001-spec.md
    stage: pending-review
    note: Add category_type Select to Cashew Category Mapping. Add Loan
      txn_type + resolved_route enum values to Cashew Import Row. Hide
      run-level default_customer / default_supplier from Cashew Import Run
      form (keep cols nullable for f004 revert).
      TD-resolved D1.a — two distinct txn_types (Loan Receivable / Loan
      Payable) over single Loan + sub-route. Save-time + validate-time
      account-class predicate (option C). Transfer-family rows (Balance
      Transfer / Balance Correction → Transfer / External Transfer /
      Adjustment) bypass category_type entirely — confirmed against
      current parser + mapping pipelines.
  - id: c002
    name: parser-loan-routing
    type: backend-module
    depends_on: [c001]
    spec_file: specs/c002-spec.md
    stage: pending-review
    note: Parser sets txn_type from category_type + income_flag per
      Decision 1's 4-route table. New shared helper category_lookup.py
      so parser + mapping read same source. Validate-time re-evaluation
      chosen (option b) — no CSV re-upload after category_type edits.
      Loan routes set resolved_route in parser; Income/Expense routes
      stay with mapping engine threshold logic.
  - id: c003
    name: mapping-engine-simplification
    type: backend-module
    depends_on: [c001, c002]
    spec_file: specs/c003-spec.md
    stage: pending-review
    note: Strip rule-based party fallback chain in importer/mapping.py.
      Engine validates "party present + party_type matches category_type
      expectation" only. Pre-fills resolved_party_type from txn_type (the
      only derivable invariant). Two error codes — LOAN_PARTY_MISSING +
      existing PARTY_MISSING. party_source field deprecated (kept for f004
      revert compat); engine writes null. New helper validate_party_present
      in validation.py.
  - id: c004
    name: posting-loan-handler
    type: backend-module
    depends_on: [c001, c002]
    spec_file: specs/c004-spec.md
    stage: pending-review
    note: New posting routes — Loan Receivable JE, Loan Payable JE.
      Party_type + party land on the receivable/payable GL line. Honors
      f001 multi-currency + rounding rules. Two route branches in
      post_row dispatcher; shared _post_loan_je core. Decision 1
      4-row DR/CR table drives leg assignment. Posts standard ERPNext
      Journal Entry — f004 revert works as-is via doc.cancel().
  - id: c005
    name: validation-error-prefix
    type: backend-module
    depends_on: [c001]
    spec_file: specs/c005-spec.md
    stage: pending-review
    note: Prefix every validation_error_message with [Row {row_idx}].
      Confirm diagnostics_file CSV carries row_idx; extend if not.
      Single shared helper errors.set_row_validation_error stamps prefix
      + double-prefix protection for c002 option-b re-validate path.
      File-level errors (no row_idx) remain unprefixed.
  - id: c006
    name: vue-row-explorer-page
    type: frontend-page
    depends_on: [c001, c003, c005]
    spec_file: specs/c006-spec.md
    stage: pending-review
    note: Frappe Page at /app/cashew-row-explorer/<run-name>. Vue 3
      SFC, lazy-loaded by page controller. Filter, 5 presets (Compact /
      Resolution / Validation / Posted / Loans-and-Parties), status
      pills, inline party edit, fix-modal driven by
      validation_error_code, bulk party set. Three whitelisted API
      methods (load / set_party / revalidate) on cashew_integration.api.
      Mutation gated by run.status ∈ {Draft, Validated, Failed,
      Cancelled, Revert-Failed}. Re-validation reuses c002 + c003
      helpers — single source of truth. Loan rows surface title +
      sub_category + note via Loan-details inline section (Option A,
      no new schema fields).
  - id: c007
    name: import-run-form-slim
    type: form-customization
    depends_on: [c006]
    spec_file: specs/c007-spec.md
    stage: pending-review
    note: Add "Open in Row Explorer" custom button to Cashew Import Run
      form (deep-links to /app/cashew-row-explorer/<run-name>). Grid
      stays as-is per user decision 2026-05-03 — table still useful
      for in-form glance. default_customer / default_supplier already
      hidden by c001 (no double-hide here). Component name retained
      for traceability; original "slim grid" framing dropped.
  - id: c008
    name: loan-accounts-guard
    type: backend-module
    depends_on: [c001]
    spec_file: specs/c008-spec.md
    stage: pending-review
    note: Validate Loan Receivable + Loan Payable accounts exist when a
      Loan-typed Category Mapping is saved. Friendly error if missing,
      pointing to setup wizard / chart-of-accounts setup.
      Helper check_loan_account_class_exists in validation.py runs in
      controller before c001 predicate. Single-company assumption (per
      Configuration Structure decision). Filters is_group=0, disabled=0.
  - id: c010
    name: account-mapping-revalidate-parity
    type: backend-module
    depends_on: [c002]
    stage: done
    note: >
      Quick patch 2026-06-02 (bmad-fb-quick). Account mapping is now
      re-resolved at Validate Import, mirroring the c002 option-b
      category re-resolution. Previously CASHEW_ACCOUNT_NOT_MAPPED /
      EXTERNAL_ACCOUNT_NOT_MAPPED were frozen in _PARSE_STAGE_ERRORS as
      "permanent" — a mapping added/activated between parse and validate
      was NOT picked up, forcing a CSV re-upload + re-parse (which breaks
      if the uploaded File is gone from disk). Fix in api.py
      validate_import: (1) dropped both account codes from
      _PARSE_STAGE_ERRORS (only FILE_* stay permanent); (2) new "Step 0a"
      rebuilds the account map from current Cashew Settings and re-runs
      _resolve_erp_account per non-Skipped/Error row; (3) persistence
      block now writes resolved_erp_account + resolved_external_account
      (previously only category routing was persisted — a now-mapped row
      would validate Valid but reach the worker with a null ERP account).
      Verified live on CASHEW-IMPORT-2026-000006: 2 stale account-error
      rows (Elevate Pay, NSave) → 43 valid / 0 failed, ERP accounts
      persisted. File-structure errors still require re-upload (correct).
  - id: c011
    name: import-row-field-guide
    type: full-stack
    depends_on: []
    stage: done
    note: >
      Quick build 2026-06-02 (bmad-fb-quick). Serves the feature's
      "make import behavior understandable" goal: a plain-language guide
      to every Cashew Import Row field (39 fields across 8 groups),
      addressing user confusion about fields like resolved_external_account.
      SINGLE SOURCE OF TRUTH for help text, shared Desk + SPA per user
      request: definitions authored once in
      cashew_integration/importer/field_guide.py (FIELD_GUIDE_GROUPS +
      FIELD_DEFINITIONS; labels merged live from doctype meta so renames
      don't drift). Exposed via whitelisted api.get_import_row_field_guide
      (gated on Cashew Import Run read perm — static reference data, no
      doc). Desk: "Field Guide" custom button on Cashew Import Run form
      (always visible) opens a grouped dialog with a client-side filter
      box; result cached per session. SPA reuse = call the same endpoint
      (CLAUDE.md api.py-reuse rule); not yet wired into the Vue SPA.
      Verified: endpoint returns 8 groups / 39 fields, all label+def
      populated.
depends_on:
  - f001

components_dropped_during_td:
  - id: c009
    name: category-type-backfill-migration
    why: |
      User decision 2026-05-03 — drop. c001 sets category_type default
      to Income on the field itself, so existing Cashew Category Mapping
      rows pass validation on first save without explicit backfill.
      Greenfield-enough state; user will re-tag the few existing
      mappings manually if/when they edit them. No data loss risk —
      existing import-run / import-row records are frozen and don't
      reference category_type.
