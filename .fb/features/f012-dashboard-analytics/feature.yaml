test_requirements:
  automated: partial
  notes: >
    Backend, unit-tested:
      - Time-series bucket boundaries in SITE timezone — a late-night UTC
        posting must land in the correct local bucket.
      - The 92-day granularity switch, exercised on both sides of the boundary.
      - Per-bucket totals reconcile to the existing single-period totals; the
        series must sum to income_total / expense_total for the same period.
      - Permission scoping still applied through the new aggregates.
      - Budget cycle generation from an epoch anchor: monthly, and at least one
        non-monthly reoccurrence, including a partial trailing cycle.
      - The unrecognised-reoccurrence guard RAISES.
      - The C5.2 matching rule, with a fixture covering an empty wallet_fks
        (all wallets), a populated category_fks_exclude, and an integer-string
        category PK.
      - read_budgets() upsert is idempotent on budget_pk across two runs.
    Frontend: no chart-rendering tests. Verification is a browser pass over
    /cashew at desktop and phone widths, plus a bundle-size check confirming the
    tree-shaken ECharts import and the total absence of ApexCharts.
    Data check: the two live budgets should reproduce the figures in c009/c013
    notes above once imported.
    built: |

      2026-08-07. `frontend/src/pages/FinanceDashboard.vue` restructured, plus one responsive fix in `SpendHeatmapChart.vue`.
      SECTIONS, NOT ONE SCROLL. Eight charts in an undifferentiated column all look equally important and give the reader no way in. The page is now four named sections — Trends, Where it went, Goals and limits, Holdings and imports — in the order the questions actually arrive: what do I have (the tiles, which keep the page header as their heading), how did it move, where did it go, am I inside my own targets. Each heading carries a one-line subtitle so a reader can skip a section without decoding its charts first.
      The sankey is full width and alone: it carries three columns of labels and is the only chart here that is unreadable at half the page. Everything else stays in `grid lg:grid-cols-2`, which is ONE column below the lg breakpoint (f010 D2.c) — no row depends on its neighbour being beside it rather than above it, so the phone layout is the same content in one readable column and not a shrunken desktop grid.
      The "Goals and limits" section is dropped in its entirety — heading and all — when Cashew carries no usable budget, using the same `selectBudgets` filter the two cards use internally. A section title over two blank cards reads as a surface that failed to load.
      Mobile fix carried into c007: the calendar's `cellSize` is now `['auto', CELL]`. A fixed 14px cell across six months runs off the canvas on a phone and the last weeks simply vanish; a non-square cell is a cosmetic loss where a missing week is a factual one, so the grid gives up squareness to keep every day on screen. Row height stays fixed so the seven-day week never collapses.
      Verified: `bench build --app cashew_integration` clean.
      NOT VERIFIED, AND THIS IS THE MAIN GAP: no browser check at any width. The section rhythm, the sankey's height at full width, the calendar's auto cell and the one-column phone degradation have all been reasoned about and none have been seen. The approved demo remains the layout reference and this arrangement has not been compared against it.
