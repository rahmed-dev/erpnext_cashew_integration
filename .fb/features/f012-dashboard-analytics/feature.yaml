review_2026_08_07: >
  A read-through review of the finished build found two real defects, both
  confirmed against work.local and both now fixed.

  ONE — income budgets came back with a negative spend, so c009 could never
  have drawn anything. _spend_by_account_day nets debit minus credit, which is
  the right direction for an expense account and the wrong one for an income
  account, where money arrives as a credit. Probed live: Salary Income - CS
  returned -80000.0 for the period. The gauge clamps its arc at zero while its
  detail text does not, so a savings goal would have shown an empty dial over a
  minus-sign percentage. budget_cycles now flips the sign when the budget's own
  is_income flag is set — once, on the server, rather than in each of the two
  surfaces that read the block. Re-probed with a seeded income budget: cycles
  now read 84000, 40000, 40000. One cycle still reads negative, correctly: the
  ledger carries a real 84,000 income reversal in that month.

  TWO — money_flow returned a `total` that double-counted. It summed every
  link, so the same money was counted once arriving from income and again
  leaving to an expense: 80,000 in and 29,665.18 out were reported as
  109,665.18 "traced through the period", a figure matching nothing in the
  ledger, and the sankey's per-ribbon "share of flow" divided by it, halving
  every percentage. The key is gone. The block now returns `inflow` and
  `outflow` separately, the card shows both, and a ribbon's share is measured
  against its own column.

  Not fixed, and still open: c013 calls singleBar() eight times per budget per
  render where c009 was refactored to a computed map; the sankey footnote lists
  three of the four excluded categories, omitting income spent straight to an
  expense; c009's partial-cycle footnote lacks the top margin c013's has; the
  "Goals and limits" heading shows when only limits exist; and _load_budgets
  scans GL from the earliest budget start_date rather than the filter start.

first_browser_pass_2026_08_07: >
  The feature was opened in a browser for the first time on the live site and
  three defects surfaced that no amount of unit testing would have caught.

  DEPLOY, not code: cashew.html is committed and hardcodes the build's asset
  hashes, while public/frontend/ is gitignored. A server that pulls without
  building serves a shell naming files it does not have. Worse, the resulting
  404 came back with Cache-Control max-age=14400, so browsers kept replaying it
  for four hours after the build fixed the files — and because vite hashes are
  content-derived, an unchanged rebuild reproduces the same names and the stale
  entry still matches. Worth making cashew.html resolve the manifest at request
  time, the way CashewPWAFile already does for the service worker.

  THE FISCAL YEAR WAS THE CALENDAR YEAR. resolvePeriodRange took a
  fiscalYearStart through its second argument and fell back to January 1 when
  absent; no caller ever passed one, so the fallback was the only path that ever
  ran. On a site whose fiscal year is July to June this handed the reader six
  months of the previous year under a "This Fiscal Year" label. Fixed by
  resolving the fiscal year server-side into the boot dict (cashew.py
  _current_fiscal_year) and reading it inside the resolver rather than at each
  call site, so a new caller cannot reintroduce it by forgetting an argument.
  The preset now relabels itself "This Year" when the site has no Fiscal Year
  record, rather than making a claim about books that nothing supports.

  "(OTHER)" NAMED NOTHING. Four independent top-N folds — _top_n_series,
  the balances fold in _balance_blocks, _top_n_with_other in api.py, and
  _fold_flow_nodes — each emitted an amount the reader could not attribute to
  anything, resolvable only by leaving the dashboard for a Desk report. All four
  now carry a `members` list, and the four surfaces show it: treemap tooltip
  plus a footnote naming every one, account-balance footnote, donut list as a
  collapsed <details>, sankey node tooltip. Tests in
  TestOtherFoldsNameTheirMembers cover all four together, because the failure is
  identical in each and a fifth fold that forgets would otherwise pass silently.

  STILL OPEN from the same sweep: boot serves `system_timezone` and no frontend
  code reads it — every "today" in the SPA is the browser's, not the site's, so
  a user in another timezone can land in the wrong bucket at a period boundary.
  Same shape as the fiscal-year bug (a server-owned value supplied and ignored),
  lower impact on a single-timezone deployment.

