      NOT VERIFIED: no browser check. And work.local's net worth never goes negative in any period tried, so the negative-curve footnote and the `scale: true` axis behaviour have not been seen rendered — only the code path is reasoned. `test_mapping` carries 11 pre-existing failures on this bench (online rate lookup, category route); it imports nothing from dashboard_series and was already failing before this batch.

