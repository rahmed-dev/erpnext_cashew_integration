# ---------------------------------------------------------------------------
# PREREQUISITE — there is none. Kept as a tombstone so it is not reinvented.
# ---------------------------------------------------------------------------
prerequisite: |
  NONE. Every component is ungated. (Decision 7.)

  DO NOT REINSTATE THE OPENING-BALANCE PREREQUISITE. An earlier version of this
  file gated c005 / c008 / c010 on posting opening balances. That was wrong, and
  finding 1 of system-arch/import-integrity-2026-08-07.md was WITHDRAWN for the
  same reason. Confirmed twice by independent computation, agreeing to the cent:
  Petty Cash stood at 0.28 on 2026-03-04, the day before the import window, and
  ERPNext already holds exactly that; Saving stood at 214,695.00 and matches
  exactly; every other imported wallet opened at zero. Cashew's OWN running
  balance for Petty Cash reaches -117,357.72 on 2026-01-01. The deep negative is
  what the source data says, not an artefact.

  THE CODE IS GONE (user instruction, 2026-08-07). importer/opening.py and the
  api.py endpoints opening_balance_audit / post_opening_balances were DELETED,
  not just unwired — a "post an opening balance" button invites plugging a real
  curve with a made-up number. f013 c004 is marked withdrawn. Recover from git
  history only if a genuine mid-life account ever needs one.

  Two known balance gaps, neither blocking anything: Elevate Pay reads -1,238.85
  PKR on live until the f013 repost script runs (ACC-JV-2026-00275); Petty Cash
  is 1,324.00 PKR below Cashew, untraced, and NSave 18.00 USD above it from a
  manual JE (ACC-JV-2026-00625).

backfill: |
  DECLINED BY THE USER, 2026-08-07. Do not re-raise it, and do not plan any
  component around history that is not there.

  It was offered because the live ledger holds 358 submitted Journal Entries
  against the backup's 651 paid transactions — 2025-02 through 2025-11 entirely
  absent, 2025-12 through 2026-02 mostly absent, earliest GL Entry 2025-12-01
  against a Cashew history starting 2025-02-05. Importing the older windows via
  f011 c002 would have taken chart history from roughly 5 months to 18.

  The user declined: imports run regularly on the live site from the point the
  app was installed, and the pre-installation history is not wanted. Nothing is
  broken — the runs were deliberately windowed from 2026-03-05, which is where
  the user started.

  CONSEQUENCE, accept it and design for it: the dashboard has roughly 5-6 months
  of usable history at build time, growing forward. Every chart must read well
  at that length. Specifically:
    - The calendar heatmap (c007) renders part of one year, not a multi-year
      grid. Do not lay out a fixed 12-month calendar.
    - The trend chart (c004) and balances (c005, c010) have few monthly buckets,
      so the C5.8 daily/monthly switch at 92 days matters more than it looks —
      most real selections will land on the DAILY side.
    - Budget per-cycle series (c009, c013) will typically show a handful of
      cycles. The single-cycle gauge path is the common case, not the edge case.

  The only new thing genuinely missing from the live site is BUDGETS, which is
  c012 — budgets have never been imported because the importer has never read
  them. That is the actual gap, and it is a build task, not a data task.

  CONFIG-ONLY BACKFILL IS IN SCOPE (user, 2026-08-07). Transaction history is
  not backfilled; budget/savings CONFIG is. See c015 — a budgets-only sync that
  reads a backup for its budgets and nothing else, so an existing site can pick
  up the new feature without re-running any transaction import.

key_architecture:
  - Charting engine is Apache ECharts via vue-echarts. ApexCharts and
    vue3-apexcharts are REMOVED once IncomeExpenseChart is ported — two engines
    must not ship simultaneously past the port. Supersedes f010 Decision 9.
  - Every chart goes through ONE shared <CsChart> wrapper owning theme, palette,
    currency/tooltip formatting, empty state, loading state, and resize. No page
    builds an ECharts option object inline.
  - Tree-shaken echarts/core imports with explicit chart + component
    registration. Never `import * from 'echarts'` — the SPA is PWA-precached
    (f010 c014) so bundle size is a real cost.
  - dashboard_summary is EXTENDED additively with THREE time-series blocks, each
    sized to its consumer per C5.8 — `daily_spend` always daily; `series` daily
    when the period spans <= 92 days else monthly; `budget_cycles` bucketed on
    each budget's own anchor, computed server-side. Existing keys keep names.
  - Balance history is running GL sums — one grouped query plus a Python prefix
    sum over an opening cumulative read as of the day before period_start.
    Not period-end snapshots, not one query per bucket (C5.8).
  - SPA API discipline rule 4 still binds — ONE aggregate endpoint per surface,
    ignore_permissions=False internally, has_permission gates at entry. Charts
    do not each get an endpoint.
  - Period bucketing is site-timezone aware (same discipline as f011 c001); a
    UTC-bucketed posting date lands transactions in the wrong month. This
    applies to Cashew's epoch-second budget dates too (C5.4).
  - Colour comes from one curated 10-hue categorical ramp in the chart theme,
    locked in Decision 4; accent stays primary/emphasis. Narrowly amends
    design-philosophy.md point 6.
  - NO DARK MODE (C5.6). The SPA has zero `dark:` utilities. The ramp's dark
    column is a recorded forward asset, not a deliverable. Do not port the
    demo's theme toggle.
  - Chart-slice drill-down into transaction lists stays OUT OF SCOPE (f010 D9).
  - Mobile-responsive still binds (f010 D2.c) — seven charts must degrade to one
    readable phone column, not a shrunken desktop grid.

# ---------------------------------------------------------------------------
# BUILD ORDER
# ---------------------------------------------------------------------------
build_order:
  wave_1_gates: >
    c001, c002, c014, then c012, then c015. c001/c002/c014 are mutually
    independent and can proceed at once. c012 needs c014's resolver, because a
    budget whose scope is not fully mapped is not imported (Decision 6). c015 is
    the budgets-only sync built on c012's reader — it is what actually gets
    budgets onto the live site. Nothing downstream builds until c001 (the
    wrapper) and c002 (the data) land.
  wave_2_charts: >
    c003, c004, c005, c006, c007, c008, c009, c010, c013 — all ungated, each one
    chart or card against a block c002 already returns.
  wave_3_layout: >
    c011 last — it arranges what exists and cannot be specified before the
    pieces are real.

components:
  - id: c001
    name: ECharts engine swap — vue-echarts, <CsChart> wrapper, chart theme + curated palette, port IncomeExpenseChart
    stage: done
    status_history: [not-started, working, done]
    depends_on: []
    wave: 1
    built: >
      DONE 2026-08-07 (Quick dev). Files:
        frontend/src/charts/echarts.js      — the ONLY module importing echarts.
          Tree-shaken echarts/core + explicit registration of the whole f012
          inventory (bar, line, pie, treemap, heatmap, sankey, gauge; grid,
          tooltip, legend, visualMap, calendar, markLine, markPoint) so no
          wave-2 chart has to touch engine wiring.
        frontend/src/charts/palette.js      — locked 10-hue RAMP, SEMANTIC
          income/expense/transfer, CHROME neutrals, readToken/accent, and the
          alpha()/alphaToken() rgba builders that keep zrender off color-mix().
        frontend/src/charts/theme.js        — baseOption (palette, fonts,
          reduced-motion, tooltip skin pinned to the z-50 overlay band),
          moneyAxis, categoryAxis, moneyFormatters, tooltipRow/tooltipTitle,
          mergeOption (deep-merge; arrays replaced, caller wins).
        frontend/src/components/shared/CsChart.vue — the wrapper. vue-echarts
          and the engine load ASYNC inside it, so the chart chunk is not even
          requested until a chart with data mounts. Owns theme merge, loading
          skeleton, empty state, autoresize, and a MutationObserver on the
          <html> style attribute so an accent change rebuilds the option.
        frontend/src/utils/money.js         — currency formatting extracted from
          AmountDisplay so a tooltip and a tile cannot disagree; AmountDisplay
          now imports it (behaviour unchanged).
        IncomeExpenseChart.vue ported to an ECharts donut. The port also retired
          its hand-rolled cursor-tracking hover panel — the native tooltip
          formatter renders the same top-5-accounts breakdown. Income/expense
          now take SEMANTIC colours instead of accent/slate.
        package.json: apexcharts + vue3-apexcharts REMOVED; echarts ^5.6.0 and
          vue-echarts ^7.0.3 added. vue-echarts 8 was rejected — it peers on
          echarts ^6 while frappe-ui pins ^5.6.0, which would have put two
          echarts copies in node_modules. v7 peers on echarts 5.
        vite.config.js: vendor-charts group now matches echarts|vue-echarts|zrender.
      Verified: yarn build clean. vendor-charts is 741 kB raw / 250 kB gz and
      LAZY (nothing but CsChart imports it). Tree-shaking confirmed by symbol
      probe — treemap/sankey/gauge present, sunburst/radar/boxplot/candlestick
      only as core string-table mentions. That is above Decision 1's 150-200 kB
      gz estimate because the full inventory is registered up front; if it
      matters later, register per chart instead.
    notes: >
      Gate component. Removes apexcharts + vue3-apexcharts from package.json.
      C5.9 RESOLVED — use vue-echarts, imported in exactly one file (<CsChart>),
      so swapping to a raw echarts.init is a one-file change if it disappoints.
      Palette module is the single sanctioned non-accent colour source; contrast
      check against card surface AND treemap/sankey label overlays before lock.
      Semantic colours (income / expense / transfer) fixed across every chart.
      TRAP: zrender does not understand CSS color-mix(). Every translucent fill
      must be built as rgba() from the token hex or it renders black, silently.
      The demo's alpha() helper is the working implementation.
      Light theme only — build no dark branch (C5.6).

  - id: c002
    name: dashboard_summary time-series extension — daily_spend, adaptive series, budget_cycles
    stage: done
    status_history: [not-started, working, done]
    depends_on: []
    wave: 1
    built: >
      2026-08-07. New module `cashew_integration/dashboard_series.py` holds all
      three blocks; `api.dashboard_summary` gained exactly three response keys
      (`daily_spend`, `series`, `budget_cycles`) and nothing else changed, so
      every f010 tile keeps working untouched.

      daily_spend — one grouped query over Expense accounts by posting_date,
      densified in Python so every calendar day in the period is present with 0
      where there was no posting. The calendar heatmap (c007) needs an
      unbroken day grid and should not have to gap-fill.

      series — `resolve_granularity` switches at 92 days INCLUSIVE of both
      endpoints (2026-01-01..2026-04-02 is daily; one more day is monthly).
      `build_buckets` emits a dense grid, and the first and last monthly
      buckets are CLIPPED to the period so a filter starting mid-month does not
      claim the earlier part of that month. Blocks: income, expense,
      income_by_category, expense_by_category (top 10 by absolute total plus a
      folded "(Other)"), balances, and totals.

      balances — running GL sums exactly as C5.8 specifies: one grouped query
      for the opening cumulative as of the day before period_start, one grouped
      query for in-period movement by (account, day), then a Python prefix sum
      across the grid. A bucket with no movement carries the prior balance
      forward instead of dropping to zero. Accounts flat at zero across the
      whole window are dropped so a stacked chart is not padded with dormant
      chart-of-accounts rows.

      Bucketing is done in Python over day-grouped SQL rather than with a
      SQL date-truncation expression. Same single-scan cost, and it keeps the
      query dialect-neutral.

      budget_cycles — `cycle_boundaries` is pure and fully unit-tested now: it
      walks backwards from the budget's anchor as well as forwards, so a filter
      predating start_date still lands on the budget's own grid, and a cycle
      running past period_end is emitted with `partial: true`. An unrecognised
      reoccurrence raises (D3.d / C5.5) instead of defaulting to monthly.
      `_load_budgets` is guarded on `frappe.db.table_exists("Cashew Budget")`
      and returns [] until c012 exists, so the block ships dormant rather than
      500ing the dashboard. THE FIELD NAMES IN `_load_budgets` ARE THE CONTRACT
      c012 MUST SATISFY: Cashew Budget {company, disabled, budget_name, amount,
      start_date, reoccurrence, period_length} plus child table Cashew Budget
      Account {account}.

      DELIBERATE SIGN DIVERGENCE, carried forward to c003/c004. The existing
      `income_total` / `expense_total` scalars clamp each GL row at zero, so a
      reversing posting never shows as negative. The series blocks NET per
      bucket instead, because a trend line that hides a refund inside its own
      bucket misreports the shape of the period. On live data the two disagree:
      income_total 274000 vs series total 190000 over 2025-01-01..2026-08-07
      (expense reconciles exactly). `series.totals` exposes the series sums so
      the gap is visible rather than surprising. c003 and c004 must not put a
      tile and a chart total from different sources side by side — pick one
      convention per surface and label it.

      _period_pnl was left completely untouched on purpose: folding it into the
      new grouped query would have changed the per-row clamp into a per-day
      clamp and quietly moved the existing tiles.

      Verified: 13 unit tests green (granularity boundary both sides, month-end
      clipping, February, timezone-local bucket key, weekly-over-a-quarter,
      anchor alignment, partial flag, period_length multiplier, backwards walk,
      raise-on-unknown-enum) plus a live smoke run on both sides of the 92-day
      switch — expense_total, series expense sum and daily_spend sum all agree
      to the cent.

      NOTE: `bench run-tests` cannot start on this bench at all — it dies with
      "DocType Department Approver not found" during test-site boot, on
      existing modules too (reproduced against test_integrity). Pre-existing
      environment fault, unrelated to f012. Tests were executed through
      `bench --site work.local console` with unittest's loader instead.
    notes: >
      Gate component. Both of this component's former open questions are CLOSED
      by C5.8 — build to it, do not re-litigate.
      THREE additive blocks on the existing response:
        daily_spend    — one scalar per day, ALWAYS daily (calendar heatmap).
        series         — income/expense, per-category, per-account balances.
                         Daily when the period spans <= 92 days, else monthly.
        budget_cycles  — per budget, one bucket per BUDGET cycle, anchored on
                         that budget's start_date + reoccurrence + period_length.
                         Server-side: the server is the only place that knows the
                         anchor and the enum. A weekly budget over a 3-month
                         filter yields ~13 buckets, not 3. Empty cycle = 0, never
                         absent. Partial trailing cycle is emitted and FLAGGED
                         partial so a half-done month is not read as a miss.
      Balance history = running GL sums via one grouped query + a Python prefix
      sum over an opening cumulative as of the day before period_start.
      Grouped SQL throughout, not a per-bucket loop — this endpoint is the
      dashboard's single round-trip.
      Existing keys (income_total, expense_total, balance_tiles, …) keep their
      names and meanings so today's tiles keep working untouched.

  - id: c012
    name: Cashew Budget import — budgets table to a Cashew Budget doctype
    stage: done
    status_history: [not-started, working, done]
    depends_on: [c014]
    wave: 1
    built: >
      Built 2026-08-07 (Quick).

      SCHEMA VERIFIED, not assumed. The real backup at
      `~/work-bench/cashew-2026-08-07-00-20-33-593933.sql` was read directly
      before writing any code, so the `budgets` column list and both live rows
      are observed fact rather than inference. All four C5 traps were confirmed
      present in that data: `wallet_fks` is NULL on Food outdoor while the
      scalar `wallet_fk` points at Petty Cash (reading the scalar would have
      narrowed the budget to one account); `category_fks` on Savings is
      `["32965a43-…","0"]`, where "0" is Balance Correction and is a plain
      integer string; `start_date` 1753988400 is 2025-08-01 only in the site
      timezone; and both budgets carry an Aug 2025 `end_date` while both are
      live, with `archived = 0`.

      READ PATH — `sqlite_reader.read_budgets(file_content) -> list[dict]`,
      deliberately separate from `read_sqlite`. Budgets never become Cashew
      Import Row records, so keeping them out of the row reader is what
      guarantees the row pipeline cannot see them. Returns `[]` when the backup
      has no `budgets` table (older export) rather than failing. The temp-file
      read-only open was refactored out of `_fetch_rows` into
      `_with_ro_connection` so both readers share it.

      PK → NAME RESOLUTION HAPPENS IN THE READER, which is the contract c014
      recorded: the mapping tables key on the Cashew NAME because the CSV export
      carries no PKs, so names are the only identifier both ingestion paths
      share. `_category_index` also handles Cashew's one level of nesting — a
      category row with `main_category_pk` set is a SUB-category, and the mapping
      table keys on (parent name, own name), so a flat pk→name lookup would file
      every sub-category under a parent it does not have.

      REOCCURRENCE — `_REOCCURRENCE_LABELS` maps 0..4 to
      Custom/Daily/Weekly/Monthly/Yearly, the declaration order of Cashew's own
      BudgetReoccurence enum. Still a FLAGGED ASSUMPTION (D3.d): every observed
      row is a (3, 1) default stamp, so nothing in the data distinguishes the
      values — but 3 = Monthly is consistent with both live budgets being
      monthly. An unrecognised value raises BUDGET_REOCCURRENCE_UNKNOWN and the
      whole budget import is abandoned for that run; it is never bucketed as
      monthly. `Cashew Budget.validate` refuses the same values, so a
      hand-edited document cannot reach the chart layer either.
      `budget_transaction_filters` is not read, not stored, and takes no part in
      matching (C5.5).

      RESOLUTION + UPSERT — new `importer/budgets.py`. `resolve_scope` returns
      `{accounts, excluded, wallets, unresolved}`; `import_budgets` upserts every
      budget with an empty `unresolved` and reports the rest. Category lookup
      mirrors the engine's fallback exactly — `(category, sub)` then
      `(category, "")` — so a sub-category already covered by a category-only
      mapping is not falsely reported as unmapped.

      MAPPING GATE (Decision 6) is implemented as written: a budget with any
      unresolved scope member is NOT imported, because budget actuals come from
      GL Entry and an unmapped member is a hole that fails in the dangerous
      direction. One deliberate refinement: an unresolved member of the EXCLUDE
      list does not gate. Excluding something unmapped removes nothing from a
      figure built only from mapped accounts, so treating it as a blocker would
      refuse a budget over a member that cannot affect its number.

      SCOPE IS MATERIALISED, NOT REFERENCED. An empty `category_fks` means ALL
      categories and an empty `wallet_fks` means ALL wallets; both are expanded
      at import time into concrete mapped accounts, because
      `dashboard_series.budget_cycles` measures spend against an account list.
      Consequence, accepted and documented: a category mapped AFTER a budget was
      imported is not retroactively in scope until the next budget import —
      which is what c015 exists for.

      DOCTYPES — `Cashew Budget` (autoname `field:budget_pk`, so idempotency is
      enforced by the primary key itself) plus three child tables:
      `Cashew Budget Account` (the resolved category scope, and the table
      `_load_budgets` reads), `Cashew Budget Exclude Category` (traceability
      only), `Cashew Budget Wallet` (the funding-account narrowing). `disabled`
      is set from Cashew's `archived` on every import, since archived is the real
      inactive signal; a manual change to it is overwritten by the next import,
      which the field description says out loud. `end_date` is deliberately not
      a field.

      HOST SEAM — `worker._import_budgets(run)`, called after the counters are
      final and before diagnostics. Guarded on `source_type == "SQLite"`, wrapped
      so no budget failure can move a counter, change the run status, or fail a
      posted ledger import; rolls back and logs instead. Budgets skipped for an
      unmapped scope are written to the Error Log as
      "Cashew Budgets Not Imported (unmapped scope)". They have no SPA surface
      yet — that is c015. Writes use `ignore_permissions=True`: the operator's
      right to run the import is the authorisation, and a run should not
      half-succeed because they hold read-only rights on a reference doctype.

      BUG FOUND AND FIXED IN c002 — `dashboard_series._load_budgets` called
      `frappe.get_all(..., parent="Cashew Budget")`, which raises `TypeError:
      DatabaseQuery.execute() got an unexpected keyword argument 'parent'` on
      v16 (the kwarg is `parent_doctype`). The branch was unreachable while the
      doctype did not exist, so the FIRST real budget would have 500'd the entire
      dashboard. Caught by the end-to-end smoke, not by any unit test.

      VERIFICATION — 17 new tests in `tests/test_budgets.py`, and 83/83 across
      test_budgets + test_dashboard_series + test_sqlite_import + test_resync +
      test_unmapped. `bench --site work.local migrate` clean. Smoke-tested
      against the REAL backup: both budgets read as Monthly, anchored
      2025-08-01, with the integer-string PK "0" intact. Full chain exercised on
      work.local — `_upsert` → `_load_budgets` → `budget_cycles` produced 3
      correct monthly cycles for a Jun–Aug 2026 window, and flipping
      `is_archived` removed the budget from the dashboard. NOT yet exercised
      through a live import run end-to-end (work.local holds no Cashew Import
      Runs), so `worker._import_budgets` itself is verified by inspection only.
      `bench run-tests` remains broken bench-wide ("DocType Department Approver
      not found"); tests were run through `bench console` with unittest's loader.
    notes: >
      Gate component for c009 and c013. Goals live in `budgets`, NOT `objectives`
      (D3.a-ter; re-confirmed on the fresh 2026-08-07 export, where objectives
      still holds only two zero-amount loan trackers). Supersedes BOTH the
      dropped Cashew Settings.savings_target_amount field AND the Cashew Goal
      doctype — neither is built.

      HOST (C5.10): sqlite_reader.read_sqlite() reads transactions ONLY and
      returns a flat CSV-shaped row list. Budgets are NOT rows and must not
      become Cashew Import Row records. Add a separate
      `read_budgets(file_content) -> list[dict]`, called by the import worker,
      upserting Cashew Budget on budget_pk OUTSIDE the row pipeline. It touches
      no run counters, cannot fail a run, and a revert does not remove budgets —
      they are reference data, not postings. Budgets import even on a
      date-windowed import (f011 c002's window scopes transactions only).

      DOCTYPE `Cashew Budget`, keyed on budget_pk (stable UUID; same idempotency
      principle as transaction_pk). Fields: budget_pk, budget_name, amount,
      is_income, start_date, reoccurrence, period_length, is_archived, is_pinned,
      plus child tables for the category scope, the category EXCLUDE list, and
      the wallet scope.

      MATCHING RULE — use the C5.2 version, which is complete. D3.a-ter's is
      missing the exclude list:
        txn.paid is true
        bool(txn.income) == bool(budget.income)
        category_fks is empty OR txn.category_fk in category_fks
        txn.category_fk NOT in category_fks_exclude
        wallet_fks   is empty OR txn.wallet_fk   in wallet_fks
      Both dimensions resolve through the EXISTING Cashew Category Mapping and
      Cashew Account Mapping — no new config surface.

      FOUR TRAPS, all verified against the fresh export:
      1. `wallet_fks` is the account scope; NULL/[] means ALL wallets. The
         SCALAR `wallet_fk` is a display anchor and takes NO part in matching
         (C5.1). Getting this backwards changes Food outdoor's 2026-07 figure
         from 36,146 to 33,890.
      2. Cashew PKs are NOT always UUIDs (C5.3). Seeded defaults are small
         integer strings — category "0" is Balance Correction, "5" is
         Entertainment, wallet "0" is Investment, and the user's Savings budget
         references "0". Treat every *_pk / *_fk as an opaque string. A UUID
         regex or uuid.UUID() parse silently drops that leg.
      3. Dates are Unix EPOCH SECONDS, not ISO (C5.4). Convert in the SITE
         timezone — 1753988400 is 2025-08-01T00:00:00+05:00. A UTC conversion
         moves the anchor a day and shifts every cycle boundary.
      4. Both live budgets carry an Aug 2025 end_date and both are live.
         start_date is the recurrence ANCHOR; end_date ends the FIRST period
         only. Deriving the window from end_date marks every budget expired.
         `archived` is the real inactive signal.

      IGNORE `budget_transaction_filters` (C5.5) — [6] on Savings, [5] on Food
      outdoor, enum undocumented and unresolvable from data. Do not store it, do
      not let it affect matching. Recorded as a known unknown: if an ERP budget
      figure ever disagrees with Cashew's own screen, suspect this field first.

      GUARD: an unrecognised `reoccurrence` value must RAISE at import, never
      fall back to monthly (D3.d). The enum is still unverified — the fresh
      export is uniformly (3,1), a default stamp rather than evidence — so this
      guard is the only protection against silently misstating every budget.

      MAPPING GATE (Decision 6, user decision): a budget whose scope is not
      FULLY mapped is NOT imported. Budget actuals come from GL Entry, so an
      unmapped scope member is a hole in the figure, and it fails in the
      dangerous direction — a limit missing one category reads UNDER limit when
      it is blown. read_budgets() reports unresolved scope members; the import
      surface gates on them via c014 and the user maps them before the budget
      import proceeds. Never a dead end: the screen that reports it fixes it.

      ASYMMETRY, accepted: the CSV export carries no budgets, so goals and
      limits are SQLite-path-only. Both surfaces hide cleanly, never error.

  - id: c014
    name: Inline unmapped-entity resolver in the SPA import surface
    stage: done
    status_history: [not-started, working, done]
    depends_on: []
    wave: 1
    built: >
      Built 2026-08-07 (Quick).

      New module `cashew_integration/importer/unmapped.py`:
        - collect_unmapped(run) — scans the run's Cashew Import Rows and reports
          every account and (category, sub_category) pair no ACTIVE mapping
          resolves, each with row_count, up to 3 sample rows, and a proposal.
          Accounts propose the modal source_currency and flag
          currency_ambiguous when the rows disagree. Categories propose
          Income/Expense from income_flag; Loan Out / Loan In are NEVER
          proposed — the export cannot express that choice and a wrong guess
          posts to the wrong side of the balance sheet.
        - apply_resolutions(accounts, categories) — writes the child rows on
          Cashew Settings. An entry whose key already exists is UPDATED and
          reactivated rather than appended, because the Settings controller
          rejects duplicate account names and duplicate (category, sub) pairs,
          so appending over a previously deactivated row would fail the save
          and strand the whole batch.

      Two collector subtleties that were the point of the component:
        - External Transfer partner accounts are extracted from the transfer
          note via mapping._extract_partner_name. They appear in no column, so
          a plain raw_account scan misses them, yet an unmapped partner blocks
          the row (EXTERNAL_ACCOUNT_NOT_MAPPED) exactly as hard.
        - Category detection mirrors the engine's (category, sub) then
          (category, "") fallback, so a sub-category already covered by a
          category-only mapping is NOT reported. Transfer / External Transfer /
          Adjustment rows never consult a category mapping and are exempt.

      api.py gained two whitelisted methods:
        - unmapped_entities(run_name) — read-only aggregate (rule 4), also
          returns company, can_write, and category_type_root_types.
        - resolve_unmapped_entities(run_name, accounts, categories,
          revalidate=True) — writes then calls validate_import, and returns the
          REMAINING unmapped lists. Re-validating in the same action is
          deliberate: validate_import already re-resolves both mapping tables
          from scratch (Steps 0/0a), so it is what actually clears the
          CASHEW_ACCOUNT_NOT_MAPPED / MAPPING_NOT_FOUND errors off the rows.
          Splitting it would leave the panel reporting entities it just fixed.

      PERMISSION DEVIATION FROM THE PLAN, deliberate: the plan said call
      frappe.has_permission on "each mapping doctype". Cashew Account Mapping
      and Cashew Category Mapping are CHILD tables of the Cashew Settings
      single (istable: 1) and carry no DocPerms of their own — a has_permission
      check against them is meaningless. The honest gate is
      has_permission("Cashew Settings", "write"), which is what both methods
      use; the read endpoint reports it as can_write so the panel degrades to a
      read-only list plus a Desk link rather than a broken form.

      KEYING NOTE FOR c012: the mapping tables key on the Cashew NAME
      (cashew_account_name / cashew_category are Data fields), not on a Cashew
      PK — the CSV export carries no PKs at all. c012 holds opaque PK strings
      and MUST resolve them to names through the SQLite categories / wallets
      tables before handing them to this module. Recorded in the module
      docstring.

      Validation is not re-implemented: the Cashew Category Mapping controller
      enforces the account-class predicate (f006 c001/c008) on parent save, and
      apply_resolutions lets that frappe.throw propagate. The SPA shows it
      inline as well as toasting it, because the inline copy is what tells the
      user which picker to change.

      Frontend: `frontend/src/components/run-workspace/sections/
      UnmappedResolverPanel.vue`, mounted at the top of RowsWorkbench when the
      run is editable (Parsed / Validated), re-reading whenever the rows
      reload. Account pickers are <LinkField> (SPA API discipline rule 2); the
      category picker narrows by root_type from category_type_root_types, which
      a test pins to validation._CATEGORY_TYPE_EXPECTATIONS so the picker can
      never offer accounts the save will reject. That narrowing is a
      convenience — the controller validate is the gate.

      Vue trap avoided: drafts are seeded when a payload lands, never lazily
      from the template. A draftFor(x) helper called during render mutates
      reactive state that render reads, which re-triggers render.

      NARROW AMENDMENT to f010's "configuration UX stays on Desk": covers only
      mappings that BLOCK an in-progress import. The panel keeps a "Manage all
      mappings on Desk" link and MappingsSection.vue is untouched.

      VERIFIED: 11 unit tests green (tests/test_unmapped.py) and `yarn build`
      clean. NOT verified end-to-end against a live run — the local work.local
      site holds zero Cashew Import Runs, and the endpoints are not deployed to
      erp.nstack.xyz, so the panel has not been exercised against real unmapped
