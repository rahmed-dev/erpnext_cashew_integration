      each row to `{ name, value, children: [] }`. Every node is a leaf today
      and ECharts treats an empty children array as one, so swapping the series
      type to `sunburst` when Cashew sub-categories eventually arrive is a
      change to this component and to nothing else.

      THE DECISION THAT MATTERS — a treemap tile's meaning is its area, and
      there is no area smaller than none. `expense_by_category` reports NET
      movement per category, so a category whose refunds outweigh its spending
      in the period arrives negative and cannot be drawn. Such categories are
      filtered out of the tiles and named underneath the chart with their signed
      figure, rather than disappearing from a breakdown the reader is reading as
      complete. Zero-total categories take the same path.

      Chrome: `roam`, `nodeClick` and the breadcrumb are all off — drilling and
      zooming imply a depth this data does not have. Colours come from RAMP by
      rank index; the tile gap is painted in CHROME.surface so tiles read as
      separated rather than outlined. The header states the plotted total and
      the tile count, both computed from the same filtered node list the chart
      draws, so the number above the chart can never disagree with it.

      NOT VERIFIED. No browser check. On work.local the period 2026-01-01..
      2026-08-07 yields exactly 2 categories totalling 29,665.30, reconciling to
      the cent against `series.totals.expense`, and no category nets negative —
      so the excluded-categories footnote has never rendered on real data, and
      neither has the (Other) fold or the label-truncation behaviour on a
      crowded treemap.
    notes: >
      D3.b RESOLVED — treemap, NOT sunburst. f011's scan found sub_category_fk
      unused across every row, so the category dimension is flat today and a
      sunburst would degenerate into the donut the dashboard already has. The
      data contract stays hierarchical (nodes with an optional children array,
      every node a leaf today) so a later swap to sunburst is a chart-type
      change in one component, not a data reshape.

  - id: c007
    name: Calendar heatmap — daily spend density
    stage: done
    status_history: [not-started, working, done]
    depends_on: [c001, c002]
    wave: 2
    built: >
      `frontend/src/components/finance-dashboard/SpendHeatmapChart.vue`, fed the
      `daily_spend` array straight from `dashboard_summary` — the one dashboard
      chart that does not take the `series` object, because daily_spend is
      always daily and must not follow the 92-day granularity switch.

      One `calendar` plus one `series` per year in view, grouped in the client
      off the ISO date prefix. Each calendar's `range` is clipped to the days
      actually present in that year rather than the whole calendar year, so a
      one-month period draws a one-month grid instead of eleven empty months.
      Height is computed from the number of years so a period spanning a year
      boundary is not squeezed into a single block's worth of space.

      THE SCALE IS CAPPED AT A PERCENTILE, NOT THE MAXIMUM (the note's warning,
      proven in the demo). `cap` is the 94th percentile of days that carried
      spending — zero days are excluded from the ranking, since on a normal
      period they are most of the grid and would drag the cap to near nothing.
      Days above the cap share the darkest shade. Both facts are stated in the
      footnote, with the count of capped days and the actual peak, so the
      compression is visible rather than something the reader has to infer.

      Two exclusions from the colour scale, both stated in words underneath:
      days netting to zero are emitted as ECharts' '-' no-data marker so an
      empty cell means "nothing happened" rather than "a little happened", and
      days whose refunds outweigh their spending are uncolourable on a scale
      starting at zero, so they are also left empty and reported as a count plus
      a total refunded figure.

      The ramp is the live accent (single-series chart, Decision 4) built with
      alpha() — a CSS color-mix() here would have rendered the entire grid black
      without warning.

      NOT VERIFIED. No browser check. work.local carries only 10 spending days
      across 2026 (219-day window, 209 zero days, 0 refund days, p94 cap 4,806.0
      equal to the peak), so on real data: the above-cap branch has never
      rendered, the refund branch has never rendered, and the multi-year layout
      has never been exercised. The 2026-07-01..2026-08-07 window has no expense
      at all and correctly falls through to the empty state.
    notes: >
      Reads c002's `daily_spend` block, which is always daily regardless of
      period length. One `calendar` + one `series` entry per year in view.
      Set the visualMap max at roughly the 94th percentile — a few outlier days
      otherwise flatten the whole scale to one colour (proven in the demo).

  - id: c008
    name: Sankey money flow — income sources to accounts to expense categories
    stage: done
    status_history: [not-started, working, done]
    depends_on: [c001, c002]
    wave: 2
    notes: >
      Heaviest backend work of the set; most likely to need its own aggregation
      shape inside dashboard_summary. Highest visual payoff. UNGATED (Decision 7).
      Its former worst exposure — all 20 USD Transfer rows carrying
      base_amount = 0 — is FIXED by f013 c002, which now stamps exchange_rate
      and base_amount onto both transfer legs.
    built: |

      2026-08-07. Backend `cashew_integration/dashboard_series.py` -> `money_flow()` (+ the pure helpers `_flow_pairs` and `_fold_flow_nodes`), wired into `api.dashboard_summary` as the additive `money_flow` key; frontend `frontend/src/components/finance-dashboard/MoneyFlowSankey.vue`. `charts/echarts.js` already registered SankeyChart, so no engine change.
      HOW A LINK IS DERIVED, which is the whole component. A GL Entry records its account and its side but not its counterpart, so there is no such thing as a "flow row" to query. The pairing is done per voucher: every account in the voucher is netted, the ones left in credit are the sources of the money, the ones left in debit are its uses, and each source is joined to each use in proportion. On a two-legged voucher — what the importer writes for an ordinary transaction — that split is exact. On a voucher with several funding legs AND several uses it is an ALLOCATION and the ledger genuinely does not record the pairing, so those vouchers are COUNTED (`allocated_vouchers`) and the count is printed under the chart. A diagram that cannot distinguish what it observed from what it inferred is the failure this avoids.
      WHAT IS NOT DRAWN, AND WHY IT IS STATED IN FIGURES. Only Income->Asset and Asset->Expense links are kept, which is what makes the graph acyclic BY CONSTRUCTION rather than by a cycle-breaking pass afterwards. Transfers between two asset accounts would be an arrow inside a single column; loans, opening balances and equity legs belong to neither end of this story. Both are accumulated and returned as `excluded.transfers` / `excluded.other` and reported in the footnote, because on this ledger the excluded amount is LARGER than the drawn flow (1,017,343.12 excluded against 109,665.18 drawn for 2026-01-01..2026-08-07) and a reader comparing the sankey to the tiles above it would otherwise conclude the chart is broken.
      REFUNDS ARE NETTED, NOT REVERSED. A refund credits the expense and debits the account, the reverse of a drawable link; a sankey arrow means "money moved this way" and a negative one cannot be drawn. It is subtracted from the forward link between the same two accounts, and a pair that nets to zero or below drops out of the diagram into the excluded figure. Live proof: Income->Asset gross is 164,000 with an 84,000 reversal against it, and the chart draws 80,000.
      Node names are made unique across the WHOLE graph, not per column: ECharts keys sankey links by name, so one account label appearing in two layers would silently merge into a single node and create exactly the cycle the layer rule exists to prevent. A label claimed by two layers is suffixed with its layer. Each layer folds its tail past TOP_N_FLOW_NODES (8) into its own "(Other income)" / "(Other accounts)" / "(Other categories)" node — a sankey has to fit a column of labels inside a card. A middle-column node reports `throughput` (in PLUS out), named that way so it can never be read as the account's balance; the tooltip says "In and out".
      Verified: 8 new unit tests in `tests/test_dashboard_series.py` (TestMoneyFlowPairing, TestMoneyFlowNodes) covering the exact-pair case, transfer exclusion, liability exclusion, refund netting, proportional split + the allocation flag, the one-sided voucher, cross-layer name disambiguation, the per-layer fold and the throughput key. Live on work.local both granularities; every drawn link asserted to be a legal layer transition. `bench build` clean.
      NOT VERIFIED: no browser check. This ledger yields a 6-node / 3-link diagram, so the per-layer (Other) fold, the cross-layer name collision and a tall column have never rendered on real data — all three are covered by unit tests only.

  - id: c009
    name: Savings goal — gauge or per-cycle series, switching on the filter
    stage: done
    status_history: [not-started, working, done]
    depends_on: [c001, c002, c012]
    wave: 2
    notes: >
      Drives off income=1 budgets. Fixed AMOUNT target, never a percentage rate
      (D3.a) and NEVER pro-rated (D3.d) — a pro-rated monthly target is a number
      that exists nowhere in Cashew.
      D3.d — c009 owns BOTH treatments and switches on the filter:
        period covers MORE than one budget cycle -> per-cycle series, one mark
          per cycle against the target line.
        period covers ONE cycle or less          -> the gauge.
      Cycle length comes from the budget's own reoccurrence + period_length via
      c002's `budget_cycles` block. Never assumed monthly.
      Hides entirely when no goal exists or the target is zero — never render a
      zero-target dial. Over-achievement is shown, not clipped (140% reads 140%).
      A cycle with no matching transactions is 0, not a gap — a month where
      nothing was saved is a missed target, not missing data.
      Live shape: "Savings", 50,000/cycle, categories Savings + Balance
      Correction, wallet Saving.
    built: |

      2026-08-07. `frontend/src/components/finance-dashboard/SavingsGoalCard.vue` plus the shared `frontend/src/utils/budget.js`. Backend change was one line of contract: `budget_cycles` now emits `is_income` per budget (and `_load_budgets` fetches it). That flag is the ONLY thing separating a savings goal from a spending limit, and the client must never infer it from the sign of the spend.
      D3.d implemented as written: the FILTER chooses the treatment. More than one cycle in view gets a bar per cycle against a dashed target markLine; one cycle or less gets the gauge. Cycle length is the budget's own reoccurrence + period_length off the server's grid, never assumed monthly.
      THE TARGET IS NEVER PRO-RATED. A monthly goal seen through half a month shows the full target and marks the cycle unfinished — a pro-rated figure is a number nobody set. Unfinished cycles are drawn at 0.45 opacity and explained in a footnote, since a half-elapsed month drawn solid reads as a settled miss.
      OVER-ACHIEVEMENT IS SHOWN, NOT CLIPPED: the gauge's axis extends to `max(100, ceil(percent/10)*10)`, so beating a goal by half looks different from just reaching it. The dial prints the percentage and, underneath, the two amounts it came from. A cycle with no matching transactions is a zero, not a gap.
      Colour: accent while short of the target, SEMANTIC.income once met — the exact inverse of c013, which sits beside it. Both cards use "left"/"over" wording rather than a bare percentage so the shared full-bar shape cannot teach two opposite meanings.
      The card renders NOTHING (no header, no empty state) when there is no income budget or the target is zero: a dial reading zero out of zero is not information. `pages/FinanceDashboard.vue` drops the whole "Goals and limits" section when neither card would render.
      Verified: work.local carries NO Cashew Budget rows at all, so the block was exercised by seeding two budgets ("SMOKE Savings" income, 50,000/month; "SMOKE Food outdoor" limit, 10,000/month), reading `budget_cycles` back at three filters, and deleting them again (`remaining budgets: []`). That confirmed `is_income` passthrough, 8 cycles for a Jan-Aug filter, 1 cycle for a single month, and `partial: True` for a filter ending mid-cycle. `bench build` clean.
      NOT VERIFIED: no browser check, and the gauge has therefore never actually rendered. The seeded budgets confirm the DATA shape only — the ECharts gauge geometry, the graphic text under the dial and the bar/gauge switch are unproven visually.

  - id: c010
    name: Account balance stacked area — one band per cash account over time
    stage: done
    status_history: [not-started, working, done]
    depends_on: [c001, c002]
    wave: 2
    notes: >
      UNGATED (Decision 7). Will show Petty Cash deep in negative territory and,
      if the optional backfill runs, an Investment band at roughly -447,850.
      Both are what the source says. Design the band treatment to survive a
      large negative rather than assuming all-positive stacking.
    built: |
      2026-08-07. `frontend/src/components/finance-dashboard/AccountBalanceChart.vue`, drawing `series.balances` (Asset accounts, top 10 by absolute closing plus a folded "(Other)") — no backend change needed beyond c005's refactor.
      THE STACKING DECISION, which is the whole component. A stacked area only means something when every band is positive: the top edge is then the total and each band's thickness is that account's share. Mix a large negative in and neither statement holds — ECharts stacks negatives onto their own baseline, the top edge stops being the total, and a reader measuring band thickness is measuring nothing. So the chart switches mode: all-positive draws stacked areas; any account dipping below zero anywhere in the window drops the WHOLE chart to unstacked lines, and the subheading says which mode is in force and why. Silently keeping the stack was the failure that mattered here — it looks correct and is not.
      `yAxis` gets `scale: true` only in line mode; a stack read against a floating baseline would misstate every band's share.
      The tooltip re-sorts accounts by their value AT THE HOVERED BUCKET rather than by series order — on a ten-band chart the reader is asking who is largest here — and prints the total underneath. Band translucency goes through `alpha()`; zrender cannot parse a CSS `color-mix()` and renders it black without warning (c001).
      Live on work.local this renders in LINE mode: Investment closes at exactly -447,850 as the component note predicted, alongside Accumulated Depreciation -28,813.30 and Petty Cash -13,747.72. Both charts are wired into `pages/FinanceDashboard.vue` as a two-column balance-sheet pair below the income/expense row; c011 owns the final layout.
      Verified: `bench build --app cashew_integration` clean; the balances contract exercised live at both granularities (8 monthly buckets and 38 daily).
      NOT VERIFIED: no browser check, so the legend scroll behaviour with 10+ bands and the line-mode readability are unconfirmed. The STACKED path has never run on real data — every period tried on work.local contains a negative account, so only the line branch has been exercised end to end.

  - id: c013
    name: Budget vs actual — spending limits (income=0 budgets)
    stage: done
    status_history: [not-started, working, done]
    depends_on: [c001, c002, c012]
    wave: 2
    notes: >
      A spending limit is NOT a gauge — exceeding a savings goal is good,
      exceeding a spending limit is bad, so the colour treatment INVERTS
      relative to c009.
      Same filter rule as c009 (D3.d): per-cycle bars when the period spans
      several cycles, a single bar against the limit when it spans one. Cycles
      with no matching transactions render as 0, not as a gap.
      Live shape: "Food outdoor", 10,000/cycle, category Entertainment,
      ALL wallets (C5.1 — not Petty Cash; the earlier record was wrong).
      Real data makes this immediately useful — actuals against a 10,000 limit
      run 22,110 / 32,689 / 32,355 / 36,146, blown roughly 3x every month.
    built: |

      2026-08-07. `frontend/src/components/finance-dashboard/BudgetVsActualCard.vue`, sharing `utils/budget.js` and the same `is_income` split with c009.
      THE COLOUR TREATMENT INVERTS, which is the point of keeping this separate from c009: passing a savings goal is good and turns green there, passing a spending limit is the failure the limit exists to catch and turns the expense hue here. The two cards sit side by side, so both label their figure "over" or "left" instead of showing a bare percentage — a full bar must not mean success on the left of the screen and failure on the right.
      Same filter rule as c009 (D3.d). Several cycles get a bar each with a dashed limit markLine; ONE cycle gets a plain DOM progress bar rather than a one-bar chart, because an axis, a grid and a tooltip wrapped around a single value is chrome to look past. That bar is scaled against the LIMIT, not against the spend: an overshoot fills it and the amount over is written beside it, where a bar rescaled to fit its own overshoot would look identical whether it went over by ten or ten thousand.
      A cycle with no matching spending is a zero, not a gap — an untouched month is a month under the limit and worth seeing. Unfinished cycles are faded and footnoted; "blown the limit" is counted over FINISHED cycles only.
      Verified: same seeded-budget smoke as c009 (the limit budget returned 8 cycles for Jan-Aug, 1 for March, `partial: True` for a mid-cycle filter, with spend clipped to the visible part of the cycle — which is exactly what the footnote claims). `bench build` clean.
      NOT VERIFIED: no browser check. The live component note's expected shape ("Food outdoor" 10,000/cycle blown roughly 3x every month) could NOT be reproduced — work.local carries no Cashew Budget rows, so no real budget has ever reached this component; the over-limit colour branch has only been driven by seeded data through the server, never rendered.

