goal: >
  Turn the SPA finance dashboard (/cashew, f010 c007) from a mostly-tiles
  surface with one chart into a real analytics view: seven charts plus a KPI
  card row, drawn on Apache ECharts, fed by time-series aggregates the backend
  does not currently produce.

context: >
  Surveyed 2026-08-07. FinanceDashboard.vue (190 lines) + 12 components; exactly
  one chart today (IncomeExpenseChart.vue, ApexCharts). api.dashboard_summary
  (api.py:931) returns single-period aggregates only — no time-series of any
  kind. The dashboard reads flat because of the data and the chart count, not
