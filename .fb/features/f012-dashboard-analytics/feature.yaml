  - id: c005
    name: Net worth / balance history chart
    stage: done
    status_history: [not-started, working, done]
    depends_on: [c001, c002]
    wave: 2
    notes: >
      UNGATED (Decision 7). An earlier version of this file blocked it on
      posting opening balances; there are none to post. The curve genuinely goes
      deeply negative because the source data does — do not "fix" that in the
      chart, and make sure the y-axis handles a large negative gracefully.
    built: |
      2026-08-07. Backend + `frontend/src/components/finance-dashboard/NetWorthChart.vue`.
      `dashboard_series._balance_series` became `_balance_blocks` and now scans Asset AND Liability in the same pair of queries (`BALANCE_ROOT_TYPES`), returning the existing `balances` list (Asset only — c010's contract is untouched) plus a new `series.net_worth` block: `{values[], assets[], liabilities[], opening, closing, has_liabilities}`. Net worth from assets alone is not net worth; it would read as wealth with a loan account sitting unmentioned beside it. Balances are carried in raw debit-credit form throughout, so assets count positive, liabilities negative, and the net figure is the plain sum; the liabilities line is negated on the way out so the tooltip can say "Owed".
      `has_liabilities` is part of the response rather than something the chart infers from an all-zero line. With `auto_settle_cash` on, this ledger books straight to cash and carries no payables, and the tooltip suppresses the Owed row entirely in that case — a standing zero would invite the reader to wonder which debts were missed.
