  - id: c015
    name: Budgets-only sync — pull budget/savings config from a backup without importing transactions
    stage: done
    status_history: [not-started, working, done]
    depends_on: [c012, c014]
    wave: 1
    built: >
      Built 2026-08-07 (Quick).

      ENDPOINT. `api.sync_budgets(file_url, company=None)`. Reads the uploaded
      backup with c012's `read_budgets()`, upserts through c012's
      `import_budgets()`, commits, and returns
      {created, updated, unchanged, skipped, total, company} — counts for the
      three outcomes, and the full skipped list with the unresolved scope members
      that caused each. It never constructs a Cashew Import Run, never reads the
      transactions table, and never enqueues anything, so it behaves identically
      against a backup whose transactions are already imported and one that was
      never imported at all.

      PERMISSION GATE. `Cashew Settings` write plus `Cashew Budget` create plus
      `Company` read on the target company. Cashew Settings write is the honest
      gate for the scope resolution: budget scope is resolved entirely through
      its mapping child tables, so anyone who may edit those already decides what
      a budget resolves to. The write itself still runs ignore_permissions (c012's
      rule — the operator's right to run the sync is the authorisation), which is
      precisely why the gate has to be at the entry point.

      OUTCOME CLASSIFICATION (new in this pass). `import_budgets` now returns
      created / updated / unchanged alongside the existing imported / skipped.
      `_upsert` snapshots the tracked scalars AND all three scope child tables
      before and after applying the backup, and SKIPS THE SAVE ENTIRELY when
      nothing moved. Two reasons: the action is meant to be re-run after editing
      a budget in Cashew, so "2 budgets imported" every time answers nothing about
      whether the edit landed; and a no-op save would put an edit in the document's
      version trail that never happened. `source_run` is deliberately excluded from
      the comparison — syncing from a second backup would otherwise report every
      budget as changed when nothing about the budget moved.

      SURFACE. `frontend/src/components/settings/BudgetsSection.vue`, in Settings
      directly BELOW Mappings — the section that fixes a skipped budget sits above
      the one that reports it. Reuses `CsvDropzone` with source-type SQLite (its
      extension-over-MIME handling and mobile picker workarounds apply unchanged).
      Reports created / updated / unchanged / total, and lists every skipped budget
      with the specific account or category that blocked it, in words rather than
      PKs. Deliberately NOT in the imports flow: a config sync appearing in the
      import history would teach the user to distrust that history (the c015 note).

      SKIPPED BUDGETS ARE REPORTED, NOT RESOLVED INLINE. c014's resolver panel is
      bound to a run (`unmapped_entities(run_name)` reads that run's rows), so it
      cannot be reused here without a second, run-free collector. This surface
      names the blocking members and links to the mapping tables; re-running the
      sync then picks the budget up. Never a dead end, but one more click than
      c014's inline flow.

      TESTS. `tests/test_budget_sync.py` — 7 sync tests (first sync creates; a
      second sync of the same backup reports unchanged AND leaves `modified`
      untouched; an edited amount reports updated; a scope-only change reports
      updated, which a parent-fields-only comparison would have missed; archiving
      in Cashew sets disabled; an unmapped scope is reported and not written) plus
      3 invoice-KPI tests for c003.

      TEST-HARNESS BUG FOUND AND FIXED IN THE TESTS: `frappe.db.delete("Cashew
      Budget", ...)` leaves the scope child rows behind, and the next import loads
      them back under the same name — the budget then holds every category twice
      and every re-run reports a change that never happened. Cleanup goes through
      `frappe.delete_doc(..., force=True)`. Worth knowing before writing any
      further test that recreates a budget.

      VERIFIED. 60/60 tests green across five modules; `bench build --app
      cashew_integration` clean; end-to-end on work.local against the real backup
      /home/riz/work-bench/cashew-2026-08-07-00-20-33-593933.sql through an actual
      File doc — total 2, and BOTH budgets correctly gated (work.local carries no
      Cashew category mappings), reporting exactly which category and wallet
      blocked each. A second identical pass returned the same result with no
      writes. NOT VERIFIED: a pass that actually creates a budget end-to-end
      through the endpoint on a site with real mappings — the create/update/
      unchanged paths themselves are covered by the unit tests against the live
      doctype, but the live gate has never yet let a real Cashew budget through.
    notes: >
      User decision 2026-08-07. Transaction history is NOT backfilled, but
      budget/savings CONFIG is — the live site has months of transactions and
      zero budgets, because budgets are a new capability and the importer never
      read them. Without this the only route to a populated dashboard is
      re-running a transaction import purely as a carrier for budgets, which is
      absurd and risks touching the ledger for a config fetch.

      SCOPE: upload a Cashew backup, read ONLY the budgets table (plus the
      categories and wallets needed to resolve its scope), upsert Cashew Budget
      on budget_pk, done. Creates NO Cashew Import Row, NO Journal Entry, NO
      GL Entry, and does NOT touch run counters. It is a configuration fetch
      that happens to read a .sql file.

      Reuses c012's read_budgets() wholesale — c012 already puts budgets on
      their own path outside the row pipeline (C5.10), so this component is the
      entry point and the surface, not a second implementation. Runs the same
      Decision 6 mapping gate through c014: a budget whose scope is not fully
      mapped is not imported, and the same screen offers the mapping.

      IDEMPOTENT AND RERUNNABLE by design. This is how the user keeps ERPNext
      budgets in step after editing a budget in Cashew — upsert on budget_pk,
      re-run whenever. A budget deleted in Cashew does not vanish from ERPNext
      (matches f002 D9's insert-only stance on deletions); `archived` is the
      inactive signal.

      SURFACE: its own action, clearly not an import run. Must not appear as a
      Cashew Import Run in the runs list — a config sync that shows up in the
      import history teaches the user to distrust that history. Report what
      changed: N budgets created, N updated, N unchanged.

      MUST STAY SAFE ON A BUSY SITE: the user imports regularly. This action
      running against a backup whose transactions are already imported, or not
      imported at all, must behave identically — it never looks at transactions.

