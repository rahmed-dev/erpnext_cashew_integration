id: f010
name: Cashew Frontend SPA (Dashboard + Imports + Workspace + Settings)
status: done
stage: done
priority: high
owner: bmad-fb-ui

goal: >
  Stand up a Vue 3 SPA bundled inside the cashew_integration app (Doppio
  pattern, www/ route, identical shape to Frappe CRM and Helpdesk) that
  replaces the heavy Cashew Import Run desk form with a purpose-built UI.
  Four surfaces in scope (updated 2026-05-24, UI phase — see D9/D10/D12):

  1. Finance dashboard (SPA landing) — P&L charts (income/expense), balance-
     sheet snapshot tiles (cash/bank, receivable, payable), period selector.
     GL-derived, NOT run aggregates. Primary manager/CFO surface.
  2. Imports list — list of Cashew Import Runs with filters, entry point to
     open existing run or create a new import.
  3. Run workspace — unified create + work + view surface for a single
     Cashew Import Run, state-driven sections (Upload / Preview /
     RowsWorkbench / CompletedSummary) covering the full lifecycle. Replaces
     the original "Run Detail" page concept; ships full row-level UX with
     extensible section-slot architecture.
  4. Settings — Appearance (accent color picker, 5 presets, writes
     Cashew Settings.accent_color) + Default Company (surfaces existing
     Cashew Settings.company). Mapping CRUD stays on Desk via deep-link.
     Added 2026-05-24 by UI phase per D12.

scope_decisions:
  surface:
    - cashew-finance-dashboard
    - cashew-imports-list
    - cashew-run-workspace
    - cashew-settings
  host: >
    SPA served at /cashew via cashew_integration/www/cashew.html, with a
    catch-all website_route_rules entry /cashew/<path:app_path> -> cashew.
    Vue Router uses HTML5 history mode. Authenticated via same-origin
    Frappe session cookie + CSRF token injected through Jinja boot data.
    Bundle built by 'bench build --app cashew_integration' through a
    Doppio build.json hook.
  out_of_scope:
    - Cashew Category / Account mapping CRUD UI (stays on Desk; Settings
      page provides a deep-link to /app/cashew-category-mapping and
      /app/cashew-account-mapping per D12).
    - Global per-run defaults on Cashew Settings (default_customer /
      default_supplier / balance_adjustment_account /
      je_rounding_tolerance remain per-run on Cashew Import Run; user
      direction 2026-05-24, no global fallbacks introduced).
    - Per-user theming (accent color is app-wide per D14; revisit if
      multi-user theming need emerges).
    - Public-portal access (logged-in users only).
    - f006 Row Explorer (`cashew-row-explorer` Frappe Page) — untouched by
      f010 per arch Decision 7. SPA Run workspace owns row-level UX
      natively; no link or embed of the Row Explorer from the SPA.
    - Per-page role-based route hiding — D5.c graceful 403 handling at
      shell level only (UI-phase scope flag).
    - Run-aggregate dashboard — replaced by finance dashboard (D9). Run
      list page already covers operator drill-in to recent activity.

architecture:
  decisions_file: .fb/features/f010-cashew-frontend-spa/arch/decisions.md
  app_claude_md_updated: true
  summary:
    - D1 Doppio CLI scaffold; keep frappe-ui; PWA (vite-plugin-pwa + service
       worker + manifest) kept on, future-proofing for installable surface
    - D2 www/ web page + HTML5 history (mirrors Frappe CRM / Helpdesk shape).
       Apps-screen tile = label "Cashew" + custom SVG icon (built in
       c002). "Back to Desk" link -> /app. All surfaces responsive
       (mobile + tablet usable v1).
    - D3 Frappe session cookie + CSRF via Jinja boot data (no API keys).
       Role gate — System Manager OR Accounts Manager.
    - D4 bench build hook via Doppio build.json; commit www/cashew.html,
       gitignore public/frontend/
    - >
        D5 Hybrid API discipline (binding):
        reads via frappe.client.*; Link selectors via frappe-ui Autocomplete
        with reference_doctype + reference_fieldname; writes reuse existing
        cashew_integration/api.py whitelisted methods with explicit
        frappe.has_permission; aggregates via new dashboard_summary endpoint
    - D6 State management library choice deferred to TD; session-only view
       state (no localStorage persistence) is a binding constraint
    - D7 SPA Run Detail (c006) owns row-level UX natively; f006 Row
       Explorer (`cashew-row-explorer` Frappe Page) untouched by f010
    - D8 Frappe realtime via Socket.IO; subscribe to Cashew Import Run
       doc_update events; degrade to 30s polling on permanent socket loss
    - D9 Dashboard is finance overview (P&L pie + balance-sheet snapshot
       tiles), NOT run aggregates. GL-derived. SPA landing route.
    - D10 Run workspace unifies create + work + view (state-driven
       sections); c005/c006/c007 renamed (imports-list / run-workspace /
       finance-dashboard).
    - D11 Run workspace ships full row-level UX today inside RowsWorkbench
       section, with declarative action/column registries for future
       row-feature extension. Closes D7.
    - >
        D12 Settings page added as 4th SPA surface at /settings. Two
        sections: Appearance (accent color, 5 presets) + Default Company
        (existing Cashew Settings.company). Mapping CRUD stays on Desk
        (deep-link). No new global per-run defaults. New component c012.
    - >
        D13 Three approved DocType schema additions (component c013):
        (a) Cashew Settings.accent_color (Select, 5 presets, default Indigo);
        (b) Cashew Import Run.notes (Small Text);
        (c) Cashew Import Row.validation_severity (Select Error/Warning/Info).
        Withdrew Cashew Import Row.row_note (redundant — `note` field
        already exists on Cashew Import Row).
    - >
        D13/D14 Amendment 1 (2026-05-24, TD phase, in arch/decisions-b.md):
        accent_color Select grows to 6 options (adds "Custom"); new
        Cashew Settings.accent_color_custom Data field holds a 6-digit
        hex when Custom is selected (server-side regex validator).
        c013 now ships 4 field additions (not 3) plus a controller hook.
        SPA shell derives -700/-100/-50 shades for Custom hex via HSL
        math (c004 spec finalizes).
    - D14 Accent color stored on Cashew Settings (Single doctype), app-wide
       (not per-user). Boot dict carries it; shell maps preset -> 4 CSS
       custom properties (--cs-accent, -700, -100, -50). Realtime
       Cashew Settings doc_update propagates theme to all open SPA tabs.
    - >
        UI-phase flag (closed, 2026-05-24): doctype field-addition channel
        closed after D13 captured 3 approved additions; future additions
        follow the same approval rule.
    - >
        UI-phase flag (closed): per-page route gating out of scope; D5.c
        handled at shell level only.

prior_art_in_app:
  - cashew_row_explorer.bundle.js — Vue 3 inside a Frappe Page using
    vue.esm-bundler.js and frappe.require resolution. Useful as a pattern
    reference for component shape only; the SPA built by f010 is a
    different architecture (full SPA at /cashew via www/ route, not a
    Frappe Page bundle).

depends_on_features:
  - f009 done (period_start / period_end available on Cashew Import Run
    for dashboard aggregates)

components:
  - id: c001
    name: spa-scaffold
    type: build-tooling
    depends_on: []
    spec_file: specs/c001-spec.md
    desc: >
      `bench add-frontend --app cashew_integration` (Doppio) with the
      answers captured in c001-spec.md (Vue, frontend dir name "frontend",
      JS not TS, frappe-ui yes, HTML5 history, app name "cashew",
      Tailwind via frappe-ui preset, lucideIcons true, build hook on).
      TD overlay applied after Doppio runs:
      - `yarn add socket.io-client@^4.7` (D8 needs it).
      - `yarn add lucide-vue-next` (DESIGN_TOKENS uses lucide).
      - >
          D6 binding: NO pinia, NO *-persistedstate, NO localStorage /
          sessionStorage anywhere in src/.
      - >
          cashew_integration/.gitignore (app root): append
          `frontend/node_modules`, `frontend/dist`, `public/frontend/`.
      - src/index.css :root block with default --cs-accent /
        -700/-100/-50 (Indigo) for sane first paint pre-boot.
      - >
          vite.config.js: confirm `lucideIcons: true` on frappeui plugin.
      State pattern (D6 resolved): frappe-ui `createResource` for data,
      module-scope composables for shared session-only state. No
      persistence. Does NOT include www/cashew.* (c002), build-hook
      verification (c003), router routes / shell (c004), pages.
  - id: c002
    name: spa-host-route
    type: route-and-jinja-entry
    depends_on: []
    spec_file: specs/c002-spec.md
    desc: >
      Four artifacts land the SPA at /cashew/*:
      - >
          www/cashew.py: get_context() perm gate + _build_boot() boot dict
          builder. no_cache=1. Boot dict shape (S1+S2+c013 fields):
          csrf_token, session_user (+ full_name + image), sysdefaults
          (default_company, default_currency=PKR fallback),
          cashew_settings (default_company, accent_color,
          accent_color_custom), default_period_start (= server first day
          of current month), default_period_end (= today),
          can_write_settings (sole boot-time perm flag — others checked
          per-action server-side per D5.3), realtime_token (D8 socket
          auth), app_version.
      - >
          www/cashew.html: vite build output (Doppio template), committed
          per D4. Must include {{ boot | tojson }} -> window.boot before
          bundle script, mount #app, hashed asset URLs.
      - >
          hooks.py: website_route_rules catch-all
          /cashew/<path:app_path> -> cashew + app_icon_url /
          app_icon_route / app_icon_title for the /app tile.
      - >
          public/images/cashew-app-icon.svg: lucide `landmark` glyph,
          currentColor stroke, 24x24 viewBox. Designer-swap-friendly.
      Permission flow (D3 refined): Guest -> 302
      /login?redirect-to=/cashew; logged-in w/o role gate ->
      frappe.PermissionError -> Frappe stock 403 page; role-bearer
      (System Manager OR Accounts Manager) -> 200 SPA shell.
  - id: c003
    name: build-hook
    type: build-tooling
    depends_on:
      - c001
      - c002
    spec_file: specs/c003-spec.md
    desc: >
      Verify Doppio's build hook + document the dev loop. Most work is
      Doppio's; TD enforces the D4 contract.
      - >
          `bench build --app cashew_integration` runs
          `yarn install --check-files && yarn build` (Shape A:
          cashew_integration/build.json, OR Shape B: hooks.py
          build_command — Doppio's installed version picks).
      - vite outputs to public/frontend/ (gitignored); built index.html
        is copied to www/cashew.html (committed per D4) — preferably via
        frappe-ui vite plugin's emitIndexHtmlTo option; fallback is a
        node -e fs.copyFileSync npm-script step (portable across OSes).
      - No source maps in production (build.sourcemap=false, set in c001).
      - >
          Dev loop documented in NEW file frontend/README.md: two-terminal
          flow (bench start + yarn dev), HMR, common pitfalls. Cross-link
          added to cashew_integration/CLAUDE.md (one line under SPA hosting
          section).
      Pure tooling + docs; no new Python or JS source.
  - id: c004
    name: spa-router-shell
    type: ui-shell
    depends_on:
      - c001
    spec_file: specs/c004-spec.md
    desc: >
      Responsive SPA shell + 5 routes (HTML5 history).
      - >
          Routes: / finance-dashboard (c007), /runs imports-list (c005),
          /runs/new + /runs/:run_name run-workspace (c006), /settings
          settings (c012), catch-all -> /. scrollBehavior: preserve on
          back/forward; top on push.
      - >
          Layout: DESKTOP (>= md) left sidebar (AppSwitcher top, NavItems,
          UserChip + RealtimeStatusIndicator bottom). MOBILE (< md) slim
          top bar (page title + UserChip dropdown w/ Back-to-Desk +
          Profile + Theme + Logout + Realtime dot) + fixed bottom nav
          bar (Dashboard / Imports / Settings, icon+label, active via
          route prefix). Bottom-nav padding accounted for via safe-area.
      - >
          ThemeController in src/theme.js: locked Tailwind 3.x preset
          table (Indigo / Teal / Burnt Orange / Monochrome / Cyan hex
          quads) + deriveShades(hex) HSL math (-700 L-10%, -100 S<=30 L=92,
          -50 S<=20 L=96) for Custom accent path. Applied to <html> CSS
          vars (--cs-accent, -700, -100, -50). Boot-time init in main.js
          BEFORE Vue mount (avoids flash of wrong color). c008 hook
          applyThemeFromDoc on Cashew Settings doc_update.
      - >
          Boot adapter src/boot.js: useSession / useSysDefaults /
          useCashewSettings / useDefaultPeriod / hasWriteSettings /
          useRealtimeToken / useAppVersion. Read-only at page load.
      - >
          State composables src/state/: useDashboardPeriod, useCurrentRun
          (route-derived), useTheme, useIsMobile (eager-init resize
          listener), useRealtimeStatus (4-state: connected/reconnecting/
          disconnected/unknown — stub here, c008 drives).
      - >
          Error handling (D5.c): Vue onErrorCaptured boundary in App.vue
          for component errors; src/errors.js installErrorInterceptors
          wraps frappe-ui HTTP layer (axios path preferred, fetch
          fallback) for 401 (toast + redirect to login) / 403 (toast) /
          5xx (toast) / network (toast). Both funnel to frappe-ui Toasts.
      - >
          Shell components in src/components/Shell/: Sidebar.vue (desktop),
          MobileTopBar.vue, MobileBottomNav.vue, AppSwitcher.vue,
          NavItems.vue, UserChip.vue, RealtimeStatusIndicator.vue.
      - Page stubs in src/pages/ for FinanceDashboard / ImportsList /
        RunWorkspace / Settings (downstream specs fill).
      - No Pinia, no localStorage, no sessionStorage (D6 binding).
  - id: c005
    name: imports-list-page
    type: ui-page
    depends_on:
      - c004
    spec_file: specs/c005-spec.md
    desc: >
      List view backed by frappe.client.get_list("Cashew Import Run").
      Filters by status, date range, company. Sort, pagination. "+ New
      Import" button routes to /runs/new. Session-only view state per
      D6 constraint. Any Link selectors use frappe-ui Autocomplete with
      reference_doctype + reference_fieldname per D5 rule 2.
  - id: c006
    name: run-workspace-page
    type: ui-page
    depends_on:
      - c004
    spec_file: specs/c006-spec.md
    spec_files_extra:
      - specs/c006-spec-b.md
    desc: >
      Unified create + work + view workspace for a single Cashew Import
      Run (D10). Single Vue page component; routes `/runs/new` and
      `/runs/:run_name` both resolve here. State-driven sections render
      based on run.status:
      - >
          UploadSection (Draft): CSV file picker, parse trigger.
      - >
          PreviewSection (Parsed): row preview + parse stats, validate.
      - >
          RowsWorkbench (Validating/Validated): full row-level UX (D11) —
          table with filters (status, txn_type, category_type, category,
          raw_account, posted state), column presets, inline party edit,
          validation-fix modal, bulk select + bulk party-set, search,
          status pills. Frappe-ui table/form/modal primitives.
          Declarative action + column registries for future row-feature
          extension (D11).
      - >
          CompletedSummary (Queued/Posted/Reverted): read-mostly results
          view + revert action.
      Reads via frappe.client.get_doc; writes reuse existing
      cashew_integration/api.py whitelisted methods (parse_and_preview,
      validate_import, queue_run, revert_run, set_row_party,
      resolve_validation, etc). Socket-driven live status from c008.
      No link or embed of f006 Row Explorer.
      Sizing: largest component in f010; section-slot architecture
      keeps each subcomponent testable in isolation.
  - id: c007
    name: finance-dashboard-page
    type: ui-page
    depends_on:
      - c004
      - c009
    spec_file: specs/c007-spec.md
    desc: >
      Finance dashboard (D9) — SPA landing at `/`. Calls
      cashew_integration.api.dashboard_summary (c009) for GL-derived
      aggregates. Strawman content: income vs expense chart, top
      categories by income/expense, balance-sheet snapshot tiles (cash/
      bank, receivable, payable), period selector (defaults TD-decided),
      lightweight recent-activity drill into imports list. Charting
      library TD-decided (strawman: frappe-ui chart wrapper or chart.js).
      Period state session-only per D6.
  - id: c008
    name: realtime-client
    type: ui-infra
    depends_on:
      - c004
    spec_file: specs/c008-spec.md
    desc: >
      Socket.IO connection bootstrap. Subscribes to doc_update events
      for Cashew Import Run (list-level and currently-viewed doc).
      Connection-status indicator. Degrades to 30s polling on permanent
      socket failure (TD-time spec).
  - id: c009
    name: dashboard-summary-endpoint
    type: api
    depends_on: []
    spec_file: specs/c009-spec.md
    desc: >
      New whitelisted method cashew_integration.api.dashboard_summary
      (period_start?, period_end?, company?). Scope updated per D9 —
      returns GL-derived finance aggregates, NOT run aggregates. Calls
      frappe.has_permission("GL Entry", "read") at entry. Internally
      uses frappe.get_all over GL Entry + Account with
      ignore_permissions=False so row-level perms still apply.
      Strawman response shape:
        {
          period: {start, end},
          income_total, expense_total,
          income_by_category: [{category, amount}, ...],
          expense_by_category: [{category, amount}, ...],
          balance_tiles: {cash_bank, receivable, payable, ...},
          recent_runs: [{name, status, period, counts}, ...]
        }
      Exact shape TD-finalized at c007 component spec.
  - id: c010
    name: api-permission-audit
    type: refactor
    depends_on: []
    spec_file: specs/c010-spec.md
    desc: >
      Audit every whitelisted write method in cashew_integration/api.py
      added by f001 / f004 / f006. Confirm each calls
      frappe.has_permission(doctype, ptype, doc=...) at entry. Add where
      missing. Behaviour of those endpoints unchanged otherwise.
  - id: c011
    name: realtime-emission-audit
    type: refactor
    depends_on: []
    spec_file: specs/c011-spec.md
    desc: >
      Audit cashew worker code paths that mutate Cashew Import Run state.
      Confirm each goes through frappe.db.set_value() / doc.save() (which
      auto-emit doc_update for realtime). Any bare SQL UPDATE must add a
      paired frappe.publish_realtime(). Pre-flight for D8 — minimal
      changes.
  - id: c012
    name: settings-page
    type: ui-page
    depends_on:
      - c004
      - c013
    spec_file: specs/c012-spec.md
    desc: >
      Settings page (D12) at SPA route `/settings`. Third sidebar nav
      item (lucide `settings` icon). Two sections:
      - >
          Appearance: accent color picker, 5 presets (Indigo / Teal /
          Burnt Orange / Monochrome / Cyan). Live preview applies tokens
          on selection; dirty-state save bar persists on click. Writes
          Cashew Settings.accent_color via frappe.client.set_value (D5.1).
      - >
          Default Company: frappe-ui <Autocomplete reference_doctype="Company">
          bound to Cashew Settings.company. Writes via the same path.
      Plus a "Manage on Desk" link group for the two mapping doctypes
      (Cashew Category Mapping, Cashew Account Mapping) — same-tab
      anchor to /app/{doctype-route}. No mapping CRUD in SPA.
      Permission: read-only mode when user lacks write perm on
      Cashew Settings (Accountant role); inputs disabled + save hidden.
      Reads via frappe.client.get_doc("Cashew Settings", "Cashew Settings").
      Theme propagation: on save, shell re-applies CSS custom properties
      from preset table; other open tabs pick up via doc_update
      subscription on Cashew Settings (D14).
  - id: c013
    name: schema-additions
    type: doctype-change
    depends_on: []
    spec_file: specs/c013-spec.md
    desc: >
      Four additive DocType field changes approved 2026-05-24 (D13 +
      D13/D14 Amendment 1 in arch/decisions-b.md). No data backfill;
      all fields optional / default-blank for existing records.
      - >
          Cashew Settings.accent_color (Select, options
          "Indigo\nTeal\nBurnt Orange\nMonochrome\nCyan\nCustom",
          default "Indigo"). Append after `company`, before mapping
          tables. Amendment 1: added "Custom" choice.
      - Cashew Settings.accent_color_custom (Data,
        depends_on="eval:doc.accent_color=='Custom'",
        mandatory_depends_on=same, server-side regex validator
        ^#[0-9a-fA-F]{6}$ in Cashew Settings.validate). Append
        immediately after `accent_color`. NEW in Amendment 1.
      - Cashew Import Run.notes (Long Text). Append after
        `diagnostics_file` inside a new collapsed Section Break
        "Operator Notes" (collapsible_depends_on=eval:!doc.notes).
      - Cashew Import Row.validation_severity (Select, options
        "Error\nWarning\nInfo", default "Error", read_only=1,
        depends_on="eval:doc.validation_status=='Error'"). Append
        immediately after `validation_status`. Server-set only.
      Includes the JSON DocType updates, the validator hook, and
      `bench migrate`. Existing validators continue to set
      validation_status="Error" and validation_severity defaults to
      "Error" alongside; future validator classes may emit
      Warning/Info. Workbench treats Warning rows as queueable;
      Error still blocks queue_run.

