status_history:
  - >
      2026-06-02 quick (bmad-fb-quick) — PATCH: queued import showed no live
      progress and completion never auto-updated (user had to refresh).
      Root cause: the SPA tracks a run via realtime doc_update (useRunRealtime →
      patchDoc), but the worker/api drove status + counters through
      `db_set(notify=True)`, and Frappe's notify_update publishes a doc_update
      whose payload is ONLY {modified, doctype, name} — no field values. So
      patchDoc merged only `modified`; status/rows_posted stayed frozen at Queued
      until a full frappe.client.get (refresh). Per-row events were already live
      (_write_row_result → emit_row_update); only the PARENT run was stale.
      Fix (server): new importer/realtime.py `emit_run_progress(run_name, fields)`
      — publishes a doc_update carrying the actual changed fields. Wired at every
      run-level transition: worker Processing/Completed/Failed/Cancelled +
      _update_counters (every progress_interval=20 rows) + revert
      Reverting/Reverted/Revert-Failed; api.py queue_run(Queued)/cancel_run/
      revert_run. Fix (client polish): RunHeader shows an animated Loader2
      "Working…/Reverting…" spinner while status ∈ {Queued,Processing,Reverting}
      so small/fast imports (under one counter flush) still signal activity; the
      status pill + posted counter now tick live for larger ones. Built + py
      compiled. NOTE: RQ worker is a long-lived process — needs `bench restart`
      (or worker restart) to load the new Python. f010 stays done.
