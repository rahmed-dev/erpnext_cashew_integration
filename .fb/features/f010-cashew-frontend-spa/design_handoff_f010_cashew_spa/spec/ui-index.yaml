# f010 Cashew Frontend SPA — Page Inventory
#
# Generated by bmad-fb-ui (2026-05-24). User-approved page list.
# See ../features/f010-cashew-frontend-spa/arch/decisions.md for the
# architecture decisions (D1-D11) these pages implement.
#
# Per-page component breakdowns live in pages/{name}.md.
# Static HTML wireframes live in wireframes/{name}.html.

feature: f010
stack: vue-spa
host: /cashew (Doppio www/ pattern — see D2)
shell_component: c004 spa-router-shell

pages:
  - name: finance-dashboard
    component_id: c007
    route: /
    purpose: >
      Finance overview — income vs expense charts, balance-sheet snapshot
      tiles (cash/bank, receivable, payable), period selector. GL-derived
      (NOT run aggregates). SPA landing page; what most users see most of
      the time since imports run once a month.
    stack: vue-spa
    status: draft
    arch_refs: [D9]

  - name: imports-list
    component_id: c005
    route: /runs
    purpose: >
      List of all Cashew Import Runs with filters (status, date range,
      company). Sort + pagination. Top-right "+ New Import" button routes
      to /runs/new. Entry point for both opening an existing run and
      starting a new one.
    stack: vue-spa
    status: draft
    arch_refs: [D5]

  - name: run-workspace
    component_id: c006
    routes:
      - /runs/new
      - /runs/:run_name
    purpose: >
      Unified create + work + view surface for a single Cashew Import Run.
      State-driven sections render based on run.status:
        - UploadSection (Draft) — CSV upload + parse trigger
        - PreviewSection (Parsed) — row preview + validate trigger
        - RowsWorkbench (Validating / Validated) — full row-level UX
          (filters, presets, inline party edit, validation-fix modal,
          bulk party-set, search, status pills); extensible action +
          column registries for future row features (D11)
        - CompletedSummary (Queued / Posted / Reverted) — read-mostly
          results + revert action
    stack: vue-spa
    status: draft
    arch_refs: [D7, D10, D11]

navigation:
  sidebar:
    top:
      - kind: app-switcher-dropdown
        items:
          - label: Cashew
            route: /
          - label: Back to Desk
            route: /app
          # additional apps appended over time
    nav:
      - label: Dashboard
        route: /
        icon: bar-chart-2
      - label: Imports
        route: /runs
        icon: file-text
    mobile: collapsible
  shell_responsibilities:
    - app-switcher dropdown
    - primary nav (Dashboard, Imports)
    - "Back to Desk" exit link
    - mobile collapse / responsive breakpoints
    - global error-toast boundary for D5.c (graceful 403 handling)
    - Socket.IO connection-status indicator (per c008)

ui_phase_flags:
  open:
    - id: doctype-field-additions
      description: >
        UI may identify that Cashew Import Run (parent) or Cashew Import
        Row (child) needs additional fields to make the workspace UX
        materially clearer. Each request captured per-page under a
        "DocType field requests" heading; Architect/Dev must approve
        before Dev implements. No auto-approval.
      arch_ref: UI-phase scope flag (open) in arch/decisions.md
  closed:
    - id: per-page-perm-ux
      description: >
        Per-page role-based route hiding is out of scope. D5.c graceful
        403 toast handled at shell level (c004). Revisit only if a
        view-only / auditor role is introduced.
      arch_ref: UI-phase scope flag (closed) in arch/decisions.md

binding_constraints:
  - id: D5
    description: >
      API discipline — reads via frappe.client.*; Link selectors via
      frappe-ui <Autocomplete> with reference_doctype + reference_fieldname;
      writes reuse cashew_integration/api.py whitelisted methods;
      aggregates via single custom endpoint (dashboard_summary).
  - id: D6
    description: >
      Session-only view state. No localStorage / sessionStorage
      persistence of view preferences (filters, presets, period
      selection). View state resets on every fresh page load.
  - id: D2.c
    description: >
      All pages responsive (mobile + tablet usable v1). Wireframes
      capture mobile breakpoints alongside desktop.
  - id: D8
    description: >
      Realtime via Socket.IO doc_update events on Cashew Import Run.
      Imports list + run workspace subscribe; degrade to 30s polling
      on permanent socket loss.

design_sequence:
  - 1. finance-dashboard — component breakdown + wireframe (anchors c009
       endpoint shape).
  - 2. imports-list — component breakdown + wireframe (consistency with
       dashboard period-selector conventions).
  - 3. run-workspace — section by section (Upload → Preview →
       RowsWorkbench → CompletedSummary) + wireframe per state.
