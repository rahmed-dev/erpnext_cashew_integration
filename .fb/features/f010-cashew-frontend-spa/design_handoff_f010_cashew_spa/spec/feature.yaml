next_step: >
  Continue UI phase: per-page component breakdown + HTML wireframes for
  finance-dashboard, imports-list, run-workspace. Sequence:
  1. finance-dashboard (lowest interaction surface, anchors data shape
     for c009 update).
  2. imports-list (depends on dashboard period-selector decisions for
     consistency).
  3. run-workspace (largest; needs section-by-section approval —
