id: f013
name: Import Integrity (drift detection, FX correctness, opening balances)
status: done
stage: done
owner: bmad-fb-quick
status_history: [done]

goal: >
  Close the six defects found by the 2026-08-07 REST reconciliation of the live
  site against its Cashew Import Runs, and give the app the ability to re-read
  its own work so the same class of defect surfaces on its own next time.

context: >
  Four of the six findings share one root: the importer was write-once. It
  stamped posted_docname on a row and never looked at that document again, and it
  computed derived values (exchange rate, base amount) without writing them back.
  Nothing in the app could tell the difference between what it claimed and what
  the ledger said — a Journal Entry cancelled in Desk left the run reporting
  itself clean.

findings_ref: ../../system-arch/import-integrity-2026-08-07.md
fixes_ref: ../../system-arch/import-integrity-fixes-2026-08-07.md

components:
  - id: c001
    name: Reconciliation engine (live doc_events + on-demand sweep + daily scheduler)
    stage: done
    depends_on: []
    build_notes: >
      New importer/reconcile.py. on_document_cancelled / on_document_trashed wired to
      Journal Entry doc_events in hooks.py stamp the owning row "Cancelled Externally" /
      "Deleted Externally" the moment it happens; frappe.flags.cashew_reverting (set in
      worker.process_revert) keeps the app's own cancels from being misreported.
      reconcile_run() is a read-only sweep for missing/cancelled/draft/date-drifted docs,
      orphaned documents no row claims, and counter drift — exposed as
      api.reconcile_run_integrity. reconcile_all_runs() runs daily via scheduler_events.
      rows_posted is exempt from drift on a reverted run WITH rows (lifetime counter),
      but not on one with no rows — that is the phantom-duplicate signature.
  - id: c002
    name: Same-currency foreign transfer FX + rate stamping
    stage: done
    depends_on: []
    build_notes: >
      posting.post_transfer_pair: the src_cur == dst_cur branch now splits. Company
      currency keeps the 1:1 shortcut; same FOREIGN currency looks the rate up via
      _lookup_erp_rate and errors the pair TRANSFER_RATE_UNAVAILABLE when none exists,
      instead of booking a USD amount into a PKR column. Also stamps exchange_rate and
      base_amount onto both legs before the balance check — mapping.apply_exchange_rates
      skips Transfer rows on purpose and nothing was writing the derived rate back.
      Live impact: Elevate Pay - CS was exactly 0.00 USD and -1,238.85 PKR, all of it
      from ACC-JV-2026-00275 booking 4.50 USD as 4.50 PKR.
  - id: c003
    name: Import Run cannot inherit another run's history
    stage: done
    depends_on: []
    build_notes: >
      no_copy on status, all five counters, period_start/end, queued_job_id, started_on,
      finished_on, diagnostics_file, import_rows. Plus CashewImportRun.validate() forcing
      a run with no creation timestamp to Draft with zeroed counters. Guard tests
      self.get("creation") NOT is_new() — is_new() reads __islocal, which is only set on
      the insert path and is None for a doc built from a dict, the exact shape a duplicate
      arrives in. Written with is_new() first, it silently did nothing; the test caught it.
      Root cause of CASHEW-IMPORT-2026-000004, which reported started_on/finished_on
      identical to run 000003 to the microsecond and earlier than its own creation.
  - id: c004
    name: Opening balance audit + Opening Entry poster — REMOVED FROM THE APP 2026-08-07
    stage: reverted
    depends_on: []
    reverted_notes: >
      DELETED on user instruction 2026-08-07, during the f012 pre-dev pass.
      importer/opening.py and the api.py endpoints opening_balance_audit /
      post_opening_balances are gone from the tree — not unwired, removed. The
      component solved a problem that does not exist for this company (see the
      build notes below, which already recorded it as withdrawn as a fix), and
      leaving a "post an opening balance" button in the app invites plugging a
      real balance curve with a made-up number. f012's charts render the true
      negative curve instead. Recover from git history if a genuine mid-life
      account ever needs one. Nothing else referenced the module; api.py parses
      clean and no test covered it.
    build_notes: >
      New importer/opening.py. audit_opening_balances() walks every leaf Cash/Bank account
      and reports the lowest point its running balance reaches; anything below zero is
      missing at least that much opening balance. post_opening_entry() writes the one-time
      ERPNext Opening Entry and refuses a foreign-currency account supplied without a rate.
      APIs: opening_balance_audit, post_opening_balances. WITHDRAWN as a fix: the full
      Cashew SQLite export shows Petty Cash opened at 0.28 on 2026-03-04 and ERPNext
      already holds exactly that, and every other imported wallet opened at zero. The
      "impossible for physical cash" argument was wrong because Cashew's OWN running
      balance for Petty Cash reaches -117,357.72 on 2026-01-01. Module stays as a
      general capability with nothing to post here.
  - id: c005
    name: Backfill patches
    stage: done
    depends_on: [c001, c002, c003]
    build_notes: >
      patches/v1_0: flag_externally_cancelled_rows, resync_run_counters,
      backfill_transfer_row_rates. All data-only, no GL writes. Verified on work.local
      (same import history): row 7 of run 000001 flagged Cancelled Externally against
      ACC-JV-2026-00042 and nothing else; run 000004 counters and timestamps cleared;
      0 transfer rows left at exchange_rate 0, recovered rates 276.53-277.00 PKR/USD.
      GL correction is deliberately NOT a patch — scripts/repost_same_currency_transfers.py
      is an explicit bench execute with dry run by default.

verification: >
  The work.local test runner cannot start (DocType Department Approver not found — an
  HRMS leftover that fails identically on untouched modules). tests/test_integrity.py is
  written for when it is repaired; the assertions were executed directly against the site
  in the meantime, 9/9 pass. bench migrate clean, all three patches in Patch Log,
  repost script dry run correctly identifies exactly one affected entry.

reconciliation_vs_cashew: >
  Against cashew-2026-08-07-00-20-33-593933.sql at 2026-07-30 (last imported day):
  Saving 454,695.00 and Emergency Fund->Meezan Bank 181,181.41 match to the cent;
  NSave 4,026.86 USD vs 1,127,907.79 PKR implies ~280.1 PKR/USD, consistent;
  Elevate Pay 0.00 USD vs -1,238.85 PKR is the c002 FX defect; Petty Cash 0.07 vs
  -1,323.93 leaves a gap of exactly 1,324.00 PKR, unexplained.

resolved:
  - >
    Petty Cash 1,324.00 gap RESOLVED 2026-08-07 and it was a real bug. A loan to
    Customer HC was created 2026-06-29 at 150,000.00 and imported, then edited in Cashew
    on 2026-07-07 05:55:38 UTC down to 148,674.00, with the 1,326.00 difference entered
    17 seconds later as its own transaction. ERPNext imported the new line but never
    revisited the edited loan, counting the 1,326.00 twice. With the PC Build's +2.00
    (13,748.00 Purchase Invoice vs Cashew's 13,750.00 note) that is exactly -1,324.00.
    Two causes, both in sqlite_reader: the window tested date_created only, and
    transaction_pk was read into a private key and discarded so idempotency keyed on
    source_hash alone — which an edit changes. See c006.

components:
  - id: c006
    name: Resync of edited source transactions
    stage: done
    date: 2026-08-07
    summary: >
      Cashew Import Row gains source_pk + source_modified (read_only, no_copy) and
      revert_status gains Resynced / Superseded. sqlite_reader windows on created OR
      modified and selects date_time_modified only when the schema has it (naming it
      unconditionally broke every older backup with "not a readable Cashew SQLite
      backup" — caught by the existing suite). New importer/resync.py detects a known
      source_pk carrying a different source_hash and, per the user's choice of
      correction-during-import over flag-and-wait, posts the replacement BEFORE
      cancelling the stale document, under frappe.flags.cashew_reverting. Guards refuse
      on a closed period (RESYNC_PERIOD_CLOSED) or a failed repost
      (RESYNC_REPOST_FAILED), always leaving the original submitted rather than the
      period empty; each errors the row instead of raising. Idempotency runs detection
      before the hash check and exempts tagged rows; a dead line building an unused set
      from raw_amount was removed. SPA: StatusPill's row-revert table carried only two
      of six states, RowsTable hand-rolled a pill keyed on values the field cannot hold,
      and InlineRowDrawer now explains a cancelled-and-replaced document.
      NOT backfilled — source_pk cannot be derived for existing rows, so detection
      starts with the next import and the existing history is unprotected (user's call).
    verification: >
      Test runner still cannot start (DocType Department Approver not found, pre-existing
      and identical on untouched modules), so tests were executed through bench console:
      test_resync 18/18, test_sqlite_import 9/9 (the CSV/SQLite hash-parity test is what
      proves the reader change left the hash alone), test_parser 22/22, test_integrity
      7/7. test_mapping's 11 failures + 3 errors were baselined against a clean stash and
      are identical, i.e. pre-existing. bench migrate clean, yarn build clean. Verified
      against the real export: a July window now returns the loan created 2026-06-29 and
      modified 2026-07-07, with txn_date still 2026-06-29.

  - id: c007
    name: Correct the one stale loan entry
    stage: ready-to-apply
    date: 2026-08-07
    summary: >
      scripts/correct_stale_loan_je.py. Identified by content, not name (ACC-JV-2026-00565
      on live, ACC-JV-2026-00375 on work.local), refuses to write unless exactly one row
      matches, dry run by default. Expected: Petty Cash -1,323.93 -> +2.07 and Customer
      HC's receivable down 1,326.00; the 2.00 residual is the PC Build invoice-vs-note
      difference and stays.

  - id: c008
    name: Resync lifecycle hardening (coherence review of c006)
    stage: done
    date: 2026-08-07
    summary: >
      A coherence review of c006 found six defects, two of which broke the ledger, and
      both traced to one mistake: resync was bolted on as a branch of the worker's
      transaction-type switch. worker._process tested txn_type == "Transfer" BEFORE
      _resync_of, so an edited transfer leg never reached the resync branch — it posted
      a second JV and left the stale one submitted, reintroducing the exact double-count
      c006 exists to prevent. Second, widening the reader to created-OR-modified made it
      return transactions dated before the window that were merely edited inside it; one
      with no prior posting was posted as NEW, so an August import could silently write
      November entries. Fix: resync gets its own lifecycle OUTSIDE the type switch —
      screen_resyncs() before the loop, the loop unchanged and unaware, then
      apply_supersessions() after everything has posted. Transfers, external transfers,
      loans and invoices all get the behaviour for free, and nothing is cancelled until
      the replacement provably exists. mark_changed_rows now propagates a tag across a
      transfer pair (editing one leg alone would otherwise strand the other as
      TRANSFER_PAIR_INCOMPLETE). The reader emits _window_reason and idempotency skips a
      modified-only row that has no prior posting, enforcing "a window may only create
      entries dated inside it". Supersession is recorded as data — new superseded_by /
      supersedes fields — so reconcile can VERIFY the successor is live instead of
      trusting a status string; a cancelled document whose replacement is also gone is
      reported as supersession-broken. Also: rows_resynced is now a real counter field
      (was emitted to the SPA and stored nowhere), _write_row_result no longer blanks
      revert_status it does not own, diagnostics gains revert_status + supersedes, and a
      failed cancel after a successful repost is stamped Supersede-Failed, counted
      failed, and fails the run — c006 let that exception unwind into the generic row
      handler with the replacement already posted and unrecorded.
    verification: >
      Executed through a frappe.init/connect harness with unittest.TextTestRunner (the
      bench runner still cannot start: DocType Department Approver not found, an HRMS
      leftover): test_resync 33/33, test_sqlite_import 9/9 (hash parity intact),
      test_parser 22/22, test_integrity 7/7 — 71/71. test_mapping 29 ran / 11 failed /
      3 errors and test_integration's setUpClass LinkValidationError ("Default Account:
      Service - CS") were both baselined against a clean git stash and are identical,
      i.e. pre-existing site-fixture damage on work.local. bench migrate clean, yarn
      build clean.

