dev_handoff: |
  Ready for Orch review. Suggested gate sequence:

  1. Static review of each component diff against its spec —
     start with c001 (schema), then c005 (error helper) since
     everything else builds on those.
  2. Run `bench build --app cashew_integration && bench restart`,
     then exercise the user's loan row from
     cashew-2026-05-03-06-31-00-370944.csv (category=Lent, USD -360.70):
       a. Ensure a Receivable Asset account exists (c008 guard test).
       b. Save a Cashew Category Mapping `Lent → Loan Out` pointing at
          that account — should pass c001 + c008 predicates.
       c. Parse + preview the CSV — Lent row should land with
          txn_type=Loan Receivable, resolved_route="Loan Receivable JE",
          requires_party-style validation flagging LOAN_PARTY_MISSING
          until party is set.
       d. Open /app/cashew-row-explorer/<run-name> — should mount the
          Vue page; pick a Customer for the Lent row inline; status pill
          flips Error → Valid.
       e. Queue the run — Loan Receivable JE posts with party on the
          receivable line.
       f. Revert the run via existing f004 path — JE cancels; party
          ledger reflects the reversal.
  3. Manual UI checks not covered by code:
       - Vue bundle loads without console errors.
       - Five preset toggle works.
       - Bulk party set on a multi-row selection.
       - Re-validate button picks up live category_type edits.

  Known gaps / deferrals:
    - No automated unit / integration test suite was added in this
      pass (specs called for tests but none were authored). Worth a
      gate decision: ship now and add tests in a follow-up, or block
      the gate on a test pass.
    - Vue bundle has not been browser-smoke-tested by the agent —
      bench build output and any runtime errors are unverified.

