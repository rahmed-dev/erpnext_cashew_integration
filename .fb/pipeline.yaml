summary: |
  Re-review pass 2: c001, c002, c007 cleared. c005 has a new major finding.

  C001 — Data Model (uniqueness enforcement)
    Added CashewSettings.validate() in cashew_settings.py with two checks:
    - _validate_unique_account_names(): throws on duplicate cashew_account_name
      across account mapping rows.
    - _validate_unique_category_pairs(): throws on duplicate (cashew_category,
      cashew_sub_category) across category mapping rows.
    DB-level uniqueness is not available for child tables (istable=1); this
    controller-level validation is the correct Frappe pattern.

  C002 — CSV Parser + Normalizer (income_flag validation)
    In parser.py _parse_single_row(), added explicit check after setting
    income_flag: if not in {"true","false"}, returns row error INVALID_INCOME_FLAG.
    Previously any non-"true" value silently fell through to Expense.

  C005 — Posting Engine (txn_date for rate lookup; transfer label fix)
    Major: _compute_implied_rates() signature changed from `run` to `txn_date`.
    Call site passes source_row["txn_date"]. Both-foreign branch now uses the
    pair's actual transaction date for _lookup_erp_rate() instead of
    run.posting_date or today().
    Minor: _extract_account_name_from_note() replaced with _extract_transfer_labels()
    which returns a (src_label, dst_label) tuple. post_transfer_pair() now uses
    positional labels so the remark reads "src → dst" not "src→dst → src→dst".
    Removed unused `today` import.

  C007 — Async Worker + Progress Polling (income_flag persistence)
    Added income_flag field (Data, read_only) to cashew_import_row.json and its
    field_order. Removed income_flag from the _dict_to_child skip set in api.py so
    it is now persisted when rows are saved during parse_and_preview. The worker's
    _row_to_dict and _child_to_dict both pick it up automatically via meta fields.
    The existing swap guard in worker.py (income_flag=="true" → swap legs) now
    works correctly at execution time. Removed stale comment from _child_to_dict.

