summary: |
  Architecture closed 2026-08-07. f012 Dashboard Analytics & Charts is ready to
  build in Quick dev mode — one agent plays every role, no TD/UI/Review handoff.

  A pre-dev coherence pass (arch/decisions.md "Decision 5") reconciled the
  record and resolved every open question. It also scanned a FRESH Cashew export
  (cashew-2026-08-07-00-20-33-593933.sql, 652 transactions) that replaced the
  2026-07-04 file the earlier decisions were grounded in, and that scan changed
  several recorded facts.

  Ten findings, C5.1 to C5.10 in arch/decisions.md:
    C5.1  budgets.wallet_fks is the account scope; the scalar wallet_fk is NOT.
          Corrects the recorded scope of the "Food outdoor" budget. The two
          readings differ by 2,256 on 2026-07 alone.
    C5.2  category_fks_exclude exists and was missing from the matching rule.
          The complete rule is now written out.
    C5.3  Cashew PKs are NOT always UUIDs — seeded defaults are integer strings
          ("0" = Balance Correction) and the user's savings budget uses one.
    C5.4  Budget dates are epoch seconds, converted in the SITE timezone.
    C5.5  budget_transaction_filters is an undocumented dimension, deliberately
          ignored. Recorded as a known unknown. The reoccurrence enum is still
          unverifiable — the raise-on-unrecognised guard is the only protection.
    C5.6  Dark mode contradiction resolved: the SPA has zero dark: utilities.
          Out of scope, and the demo's theme toggle must NOT be ported.
    C5.7  Stale supersessions cleaned up — no savings_target_amount field, no
          pro-rating, no sunburst, no Cashew Goal doctype, no objectives import.
    C5.8  c002 RESOLVED: three blocks (always-daily daily_spend, adaptive series
          at a 92-day switch, server-side budget_cycles) and balance history as
          running GL sums with a prefix sum. Retires the "daily floor" rule.
    C5.9  c001 RESOLVED: vue-echarts, confined to one file.
    C5.10 c012 RESOLVED: the importer is transaction-only, so budgets get a
          separate read_budgets() path outside the row pipeline.

  Also updated: f013 Import Integrity is DONE and closes most of the
  data-quality caveat that hung over this feature.

prerequisite: |
  NONE. The opening-balance prerequisite recorded here earlier was WITHDRAWN on
  2026-08-07 — do not reinstate it.

  It claimed c005, c008 and c010 could not be built until opening balances were
  posted, because the ledger floors at zero and Petty Cash reaches -132,313.22.
  The 2026-08-07 Cashew SQLite export settles it: Petty Cash opened at 0.28 and
  ERPNext already holds exactly that; every other imported wallet opened at zero.
  Cashew's own running balance for Petty Cash reaches -117,357.72 on 2026-01-01,
  so a deeply negative curve is what the source data actually says, not a missing
  opening entry. Working: system-arch/import-integrity-2026-08-07.md, finding 1.

  importer/opening.py stays as a general capability. There is nothing to post for
  this company, so the three components are ungated — build them in wave 2 with
  the rest.

  Real balance caveats, neither of which blocks any component:
    - Elevate Pay reads -1,238.85 PKR on live until the f013 repost script runs
      (one entry, ACC-JV-2026-00275). Fixed already on work.local.
    - NSave is 18.00 USD above Cashew, from a manual JE (ACC-JV-2026-00625, 831.00
      against Cashew's 813.00), and Petty Cash is 1,324.00 PKR below it for
      reasons not yet traced.

dev_handoff: |
  Read in this order: features/f012-dashboard-analytics/feature.yaml, then
  arch/decisions.md (Decision 5 first — where it disagrees with anything above
  it, Decision 5 wins), then demo/README.md.

  Build order:
    Wave 1, gates, all three independent and parallelisable:
      c001  ECharts swap + <CsChart> + locked palette + port IncomeExpenseChart
      c002  dashboard_summary time-series extension (three blocks)
      c012  Cashew Budget import
    Wave 2, one chart or card each:
      c003 c004 c006 c007 c009 c013   — buildable immediately after wave 1
      c005 c008 c010                  — also buildable; the opening-balance gate
                                        that used to hold these was withdrawn
    Wave 3:
      c011  layout restructure + mobile, last, against real components

  Four traps that will cost a day each if missed:
    1. zrender does not understand CSS color-mix(). Translucent fills must be
       rgba() built from the token hex or they render black with no error.
       demo/dashboard-demo.app.js has the working alpha() helper.
    2. budgets.wallet_fks NULL means ALL wallets. The scalar wallet_fk is a
       display anchor, not a filter.
    3. Cashew *_pk / *_fk are opaque strings. A UUID parse or regex silently
       drops the Balance Correction leg of the user's savings budget.
    4. Budget start_date is the recurrence ANCHOR; end_date ends the FIRST
       period only. Deriving the window from end_date marks every budget
       expired. `archived` is the real inactive signal.

  Adjacent, independent, not a dependency: f011 p004 makes SQLite the default
  import path. c012's budgets only ever arrive on the SQLite path, so doing
  p004 first is coherent, but f012 does not block on it.

