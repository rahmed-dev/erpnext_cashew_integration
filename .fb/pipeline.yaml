summary: |
  Dev pass complete (2026-05-03). All 8 components implemented per
  approved specs and persisted under .fb/features/f006-rules-clarity-and-party-resolution/.
  Each component flipped from spec to stage=pending-review in feature.yaml.

  Components shipped:
    - c001 schema-loan-and-category-type        pending-review
    - c002 parser-loan-routing                   pending-review
    - c003 mapping-engine-simplification         pending-review
    - c004 posting-loan-handler                  pending-review
    - c005 validation-error-prefix               pending-review
    - c006 vue-row-explorer-page                 pending-review
    - c007 import-run-form-slim                  pending-review
    - c008 loan-accounts-guard                   pending-review

  Key implementation notes (deviations / decisions taken at build time):
    - c008 dedupes its loan-account-class table by reading c001's
      existing _CATEGORY_TYPE_EXPECTATIONS in validation.py instead
      of duplicating a separate _LOAN_TYPE_REQUIREMENTS dict (the
      "minor refactor opportunity" the spec flagged as optional).
    - c003 wires validate_party_present from inside _validate_single_row
      (replacing the pre-c003 PARTY_UNRESOLVED block) — single per-row
      pass, same code path used by api.validate_import → queue-time.
    - c004 matches the existing posting handler trace pattern
      (cashew_import_run / cashew_row_hash / cashew_row_idx custom fields)
      rather than the cheque_no shape shown in the spec sample. The
      existing pattern is what idempotency.py + f004 revert read from.
      DR/CR per-leg derivation collapses to a uniform `if income`
      branch — receivable vs payable differs only in party_type.
    - c006 collapses the spec's 9-SFC tree into a single
      cashew_row_explorer.bundle.js with components defined inline as
      Vue 3 object-with-template-string components. No SFC loader, no
      package.json, no separate esbuild config — Frappe v15's bench
      build picks up *.bundle.js directly. Optional v1 nice-to-haves
      from spec (CSV export, vue-virtual-scroller) deferred — not in
      bundle. _ROW_EXPLORER_MUTATION_ALLOWED_STATUSES uses the actual
      Cashew Import Run status enum from this codebase (Draft / Parsed /
      Validated / Failed / Cancelled / Revert-Failed), not the spec's
      enum which mixed in non-existent values like "Validated" alongside
      missing "Parsed".

  Required before user smoke-test:
    1. `bench build --app cashew_integration` to bundle the Vue page
       (cashew_row_explorer.bundle.js + page asset registration).
    2. `bench --site <site> migrate` to register the new Page doctype
       record (cashew-row-explorer).
    3. `bench restart` (or `bench --site <site> clear-cache`) to pick up
       new whitelisted API endpoints.

